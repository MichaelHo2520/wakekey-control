<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WakeKey">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>WakeKey</title>
<!-- Static page: no secrets in here. The broker address and the wk-admin password are
     typed in on first use and, if the user asks, kept in this browser only. The device
     list lives on the broker as a retained message only wk-admin can read. -->
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #f4f6f8; --card: #fff; --text: #1d2329; --muted: #6b7682; --line: #dde2e7;
  --accent: #1f6feb; --accent-text: #fff; --ok: #1a7f37; --warn: #b35900; --bad: #cf222e;
  --chip: #eef1f4; --confirm: #b35900; --sleep: #5b5bd6;
  --ok-bg: #e9f6ec; --sleep-bg: #eeeefc; --warn-bg: #fdf1e3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1116; --card: #171b22; --text: #e6edf3; --muted: #8b96a2; --line: #2b323c;
    --accent: #2f81f7; --accent-text: #fff; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    --chip: #222832; --confirm: #d29922; --sleep: #9a9cf8;
    --ok-bg: #15281c; --sleep-bg: #1d1e36; --warn-bg: #2d2414;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
}
main { max-width: 560px; margin: 0 auto; }
h1 { font-size: 1.35rem; margin: 4px 0 16px; display: flex; align-items: center; gap: 10px; }
h1 .conn { font-size: .8rem; font-weight: 500; color: var(--muted); margin-left: auto; }
h2 { font-size: 1.05rem; margin: 0 0 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
label { display: block; font-size: .9rem; color: var(--muted); margin: 10px 0 4px; }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 6px 0 0; }
input[type=text], input[type=password], select {
  width: 100%; padding: 11px 12px; font-size: 1rem; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text);
}
.check { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--text); }
button {
  font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--chip);
  color: var(--text); padding: 10px 14px; cursor: pointer; touch-action: manipulation;
}
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button.wide { width: 100%; padding: 14px; font-size: 1.05rem; margin-top: 12px; }
button.link { background: none; border: none; color: var(--accent); padding: 6px 4px; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.acts button { padding: 18px 8px; font-size: 1.2rem; font-weight: 600; border-radius: 14px; }
button.arm { background: var(--confirm); border-color: var(--confirm); color: #fff; }
.acts.more { margin-top: 10px; }
.acts.more button { padding: 12px 8px; font-size: 1rem; font-weight: 500; }
.acts .muted { grid-column: 1 / -1; text-align: center; padding: 12px 0; }
button { position: relative; overflow: hidden; }
button.hold::after { content: ""; position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: var(--bad);
  transform-origin: left; animation: hold 2s linear forwards; }
@keyframes hold { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.row button { flex: 1 1 auto; }
.tools { display: contents; }
.secform { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
.secform h2 { font-size: .98rem; margin: 0; }
label.color { display: flex; align-items: center; gap: 10px; color: var(--text); margin: 8px 0; }
label.color input { width: 44px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
.dev-head { display: flex; align-items: center; gap: 10px; }
.dev-name { font-size: 1.2rem; font-weight: 700; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--ok); } .dot.off { background: var(--bad); }
.pill { margin-left: auto; font-size: .82rem; padding: 3px 10px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 0 0; font-size: .92rem; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; overflow-wrap: anywhere; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); }
.result { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--chip); font-size: .92rem; display: none; }
.result.show { display: block; }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--muted); font-size: .92rem; }
.hint { font-size: .86rem; color: var(--muted); margin-top: 8px; }
.empty { text-align: center; color: var(--muted); padding: 22px 8px; }
.found { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.found:first-of-type { border-top: none; }
.found span { flex: 1; }
.step { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.step b.n { display: inline-block; width: 1.6em; height: 1.6em; line-height: 1.6em; text-align: center; border-radius: 50%; background: var(--accent); color: #fff; font-size: .85rem; margin-right: 6px; }
.copy { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.copy code { flex: 1; padding: 9px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font-size: .85rem; overflow-wrap: anywhere; }
.qr { background: #fff; padding: 10px; border-radius: 10px; display: inline-block; margin-top: 8px; }
.radio { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; color: var(--text); font-size: .95rem; }
.radio input { margin-top: 5px; }
footer { text-align: center; font-size: .8rem; color: var(--muted); margin-top: 8px; }
footer button { padding: 6px 10px; font-size: .8rem; }
/* icons */
.i { display: inline-flex; vertical-align: -5px; margin-right: 6px; }
.i svg, .state .ic svg { width: 22px; height: 22px; }
.acts.more .i svg { width: 18px; height: 18px; }
.acts.more .i { vertical-align: -3px; }
.acts button small { display: block; font-size: .75rem; font-weight: 500; opacity: .75; margin-top: 1px; }
.acts.more button:last-child:nth-child(odd) { grid-column: 1 / -1; }
/* computer state on each card */
.state { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--chip); }
.state .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--card); color: var(--muted); }
.state .t { font-weight: 700; }
.state .s { font-size: .86rem; color: var(--muted); margin-top: 1px; }
.state button { margin-top: 8px; padding: 7px 12px; font-size: .9rem; }
.state.awake { background: var(--ok-bg); } .state.awake .ic { color: var(--ok); }
.state.sleep { background: var(--sleep-bg); } .state.sleep .ic { color: var(--sleep); }
.state.warn { background: var(--warn-bg); } .state.warn .ic { color: var(--warn); }
/* wake progress */
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.steps .m { width: 18px; display: grid; place-items: center; flex: none; font-weight: 700; }
.steps li.wait { color: var(--muted); }
.steps li.wait .m::before { content: "•"; }
.steps li.run .m::before { content: ""; width: 12px; height: 12px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
.steps li.ok .m::before { content: "✓"; color: var(--ok); }
.steps li.bad .m::before { content: "✗"; color: var(--bad); }
.steps li.warn .m::before { content: "!"; color: var(--warn); }
.steps .x { margin-left: auto; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.result .msg { margin-top: 6px; }
.result .row { margin-top: 8px; }
.guide { margin: 6px 0 0; padding-left: 20px; } .guide li { margin: 4px 0; }
@keyframes spin { to { transform: rotate(360deg); } }
/* journal timeline */
.tl { list-style: none; margin: 10px 0 0; padding: 0; max-height: 340px; overflow: auto; }
.tl li { display: grid; grid-template-columns: 10px auto 1fr; gap: 9px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); font-size: .86rem; }
.tl li:first-child { border-top: none; }
.tl .k { width: 8px; height: 8px; border-radius: 50%; background: var(--line); align-self: center; }
.tl [data-k=ok] .k { background: var(--ok); } .tl [data-k=bad] .k { background: var(--bad); }
.tl [data-k=sleep] .k { background: var(--sleep); } .tl [data-k=warn] .k { background: var(--warn); }
.tl [data-k=boot] .k { background: var(--accent); }
.tl time { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .8rem; }
.tl span { overflow-wrap: anywhere; }
.tl [data-k=bad] span { color: var(--bad); }
.tl [data-k=boot] span { font-weight: 600; }
.tl-empty { color: var(--muted); font-size: .86rem; margin-top: 10px; }
/* bottom sheet (replaces prompt / confirm) */
.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; animation: fade .15s; }
.sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 20px 16px max(20px, env(safe-area-inset-bottom)); animation: up .18s ease-out; }
.sheet h3 { margin: 0 0 4px; font-size: 1.1rem; }
.sheet p { margin: 6px 0 0; color: var(--muted); font-size: .93rem; white-space: pre-line; }
.sheet input { margin-top: 12px; }
.sheet .row { margin-top: 16px; }
.sheet .row button { padding: 13px; font-size: 1rem; }
button.danger { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (min-width: 600px) { .sheet-bg { align-items: center; } .sheet { border-radius: 18px; } }
@media (prefers-reduced-motion: reduce) { .sheet, .sheet-bg { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>WakeKey <span class="conn" id="conn"></span></h1>

  <section class="card" id="login" hidden>
    <form id="loginForm">
      <label for="host">Broker 位址</label>
      <input type="text" id="host" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="xxxxxxxx.ala.asia-southeast1.emqxsl.com" required>
      <label for="user">帳號</label>
      <input type="text" id="user" autocomplete="username" autocapitalize="off" spellcheck="false" value="wk-admin" required>
      <label for="pass">密碼</label>
      <input type="password" id="pass" autocomplete="current-password" required>
      <label class="check"><input type="checkbox" id="remember" checked> 記住在這台裝置（只存在這個瀏覽器）</label>
      <button class="primary wide" type="submit">連線</button>
      <div class="result" id="loginMsg"></div>
    </form>
  </section>

  <div id="app" hidden>
    <div id="devices"></div>
    <section class="card" id="foundCard" hidden>
      <h2>發現的裝置</h2>
      <div class="hint" style="margin-top:0">這些板子已經連上雲端，但還不在你的清單裡。</div>
      <div id="found"></div>
    </section>
    <section class="card" id="addCard" hidden></section>
    <button class="wide" id="addBtn">＋ 新增裝置</button>
  </div>

  <footer id="foot" hidden>
    <button id="logout">登出</button>
    <button id="forget">登出並忘記密碼</button>
  </footer>
</main>

<script>
"use strict";
const STORE = "wakekey.login.v1";
const REG_TOPIC = "wakekey/_admin/devices";   /* retained {v:1, devices:[{id,name}]}; devices cannot read it (ACL) */
const MQTTS_PORT = 8883;                       /* what boards use; the page itself uses WSS 8084 */
const CMD_TIMEOUT_MS = 20000;
const ARM_MS = 4000;
const ID_RE = /^[a-z0-9][a-z0-9-]{1,15}$/;
const $ = (id) => document.getElementById(id);
let client = null, login = null;
let registry = null;                 /* null until the retained message (or its absence) is known */
const live = new Map();              /* id -> {status, statusAt, events[]} */
const pending = new Map();           /* rid -> {resolve, timer} */
let adding = null;                   /* add-device wizard state */

/* ---------- storage (per-viewer convenience only) ---------- */
function loadLogin() { try { return JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { return null; } }
function saveLogin(v) { try { localStorage.setItem(STORE, JSON.stringify(v)); } catch (e) {} }
function clearLogin() { try { localStorage.removeItem(STORE); } catch (e) {} }

/* ---------- helpers ---------- */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function rid() { return Math.random().toString(36).slice(2, 10); }
function setConn(text, cls) { const c = $("conn"); c.textContent = text; c.className = "conn " + (cls || ""); }
/* Phones turn a scanned host into "http://host/"; keep only the host name. */
function normHost(h) { return String(h || "").trim().replace(/^[a-z]+:\/\//i, "").replace(/[/?#].*$/, "").replace(/:\d+$/, ""); }
function ago(ts) {
  if (!ts) return "";
  const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
  if (s < 60) return s + " 秒前";
  if (s < 3600) return Math.round(s / 60) + " 分鐘前";
  return Math.round(s / 3600) + " 小時前";
}
function randomPassword(n) {
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  const r = new Uint32Array(n); crypto.getRandomValues(r);
  return Array.from(r, (x) => a[x % a.length]).join("");
}
function pairingCode(host, user, pw) {
  const bytes = new TextEncoder().encode(JSON.stringify({ h: host, p: MQTTS_PORT, u: user, pw }));
  let bin = ""; bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return "wk1:" + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch (e) {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch (e2) {} t.remove();
  }
  if (btn) { const o = btn.textContent; btn.textContent = "已複製"; setTimeout(() => { btn.textContent = o; }, 1500); }
}
function devName(id) { const d = registry && registry.find((x) => x.id === id); return d ? d.name : id; }
function fmtDur(s) {
  if (s < 60) return "不到 1 分鐘";
  if (s < 3600) return Math.floor(s / 60) + " 分鐘";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h + " 小時" + (m ? " " + m + " 分" : "");
}
function vibrate() { try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) {} }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- icons (inline, stroke style like the app icon) ---------- */
const svg = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  key: svg('<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M16 7l3 3M18.5 4.5l2 2"/>'),
  moon: svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
  restart: svg('<path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/>'),
  home: svg('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'),
  wifi: svg('<path d="M2 8.8a15 15 0 0 1 20 0M5 12.4a10 10 0 0 1 14 0M8.5 15.9a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r=".8"/>'),
  monitor: svg('<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>'),
  alert: svg('<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>'),
  plug: svg('<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/>'),
  cloudOff: svg('<path d="m2 2 20 20M5.8 8.7A6 6 0 0 0 7 20h10c.8 0 1.5-.2 2.2-.6M21.6 16A4 4 0 0 0 18 10h-1.3a8 8 0 0 0-7.4-5.6"/>'),
};
function actionIcon(a) {
  if (a.op === "wake") return ICON.sun;
  if (a.op === "rescue") return ICON.wifi;
  return { unlock: ICON.key, standby: ICON.moon, restart: ICON.restart, home: ICON.home }[(a.args || {}).seq] || "";
}

/* ---------- bottom sheet: replaces prompt() / confirm() ---------- */
/* Resolves true (or the typed text when o.input is given), or null when cancelled. */
function sheet(o) {
  return new Promise((resolve) => {
    const bg = document.createElement("div");
    bg.className = "sheet-bg";
    bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><h3></h3><p></p>` +
      (o.input !== undefined ? '<input type="text" class="in" autocomplete="off">' : "") +
      `<div class="row"><button class="no">${esc(o.cancel || "取消")}</button>` +
      `<button class="yes ${o.danger ? "danger" : "primary"}">${esc(o.ok || "確定")}</button></div></div>`;
    bg.querySelector("h3").textContent = o.title || "";
    const p = bg.querySelector("p");
    if (o.text) p.textContent = o.text; else p.remove();
    const inp = bg.querySelector(".in");
    if (inp) { inp.value = o.input; inp.placeholder = o.placeholder || ""; }
    const done = (v) => { document.removeEventListener("keydown", key); bg.remove(); resolve(v); };
    const yes = () => {
      if (!inp) return done(true);
      const v = inp.value.trim();
      if (v) done(v); else inp.focus();
    };
    const key = (e) => { if (e.key === "Escape") done(null); else if (e.key === "Enter" && inp) yes(); };
    bg.addEventListener("click", (e) => { if (e.target === bg) done(null); });
    bg.querySelector(".no").onclick = () => done(null);
    bg.querySelector(".yes").onclick = yes;
    document.addEventListener("keydown", key);
    document.body.appendChild(bg);
    if (inp) { inp.focus(); inp.select(); }
  });
}

/* ---------- MQTT ---------- */
/* keep: reconnecting the same login (phone back from the background), so the cards
   stay on screen and a failure keeps retrying instead of going back to the login form */
function connect(l, fromSaved, keep) {
  if (client) { client.end(true); client = null; }
  login = Object.assign({}, l, { host: normHost(l.host) });
  if (!keep) registry = null;
  setConn(keep ? "重新連線中…" : "連線中…", keep ? "warn" : "");
  client = mqtt.connect("wss://" + login.host + ":8084/mqtt", {
    username: login.user, password: login.pass,
    clientId: "wk-web-" + rid(), keepalive: 30, reconnectPeriod: 5000, connectTimeout: 15000, clean: true,
  });
  let everConnected = false;
  client.on("connect", () => {
    everConnected = true;
    setConn("已連線", "ok");
    $("login").hidden = true; $("app").hidden = false; $("foot").hidden = false;
    client.subscribe([REG_TOPIC, "wakekey/+/status", "wakekey/+/event", "wakekey/+/resp", "wakekey/+/ui"], { qos: 1 });
    /* a retained registry arrives right after SUBACK; if none does, start with an empty list */
    setTimeout(() => { if (registry === null) { registry = []; renderAll(); } }, 2500);
    renderAll();
  });
  client.on("reconnect", () => setConn("重新連線中…", "warn"));
  client.on("offline", () => setConn("離線", "bad"));
  client.on("error", (err) => {
    const msg = /auth|password|Not authorized|Bad user/i.test(String(err && err.message)) ? "帳號或密碼錯誤" : "連線失敗：" + (err && err.message);
    if (!everConnected && !keep) { client.end(true); client = null; showLogin(msg, fromSaved ? l : null); }
    setConn(msg, "bad");
  });
  client.on("message", onMessage);
}

function onMessage(topic, payload) {
  const text = new TextDecoder().decode(payload);
  if (topic === REG_TOPIC) {
    try { const j = JSON.parse(text || "{}"); registry = Array.isArray(j.devices) ? j.devices : []; } catch (e) { registry = []; }
    renderAll();
    return;
  }
  const m = topic.match(/^wakekey\/([^/]+)\/(status|event|resp|ui)$/);
  if (!m || m[1].startsWith("_")) return;
  const [, id, kind] = m;
  if (kind === "resp") {
    let r; try { r = JSON.parse(text); } catch (e) { return; }
    const p = pending.get(r.rid);
    if (p) { clearTimeout(p.timer); pending.delete(r.rid); p.resolve(r); }
    return;
  }
  const d = liveOf(id);
  if (kind === "ui") {
    let u = null; try { u = text ? JSON.parse(text) : null; } catch (e) {}
    d.ui = u && typeof u === "object" && Array.isArray(u.actions) ? u : null;
    renderAll();
    return;
  }
  if (kind === "status") {
    if (!text) { live.delete(id); renderAll(); return; }   /* retained status cleared (device removed) */
    try { d.status = JSON.parse(text); } catch (e) { return; }
    d.statusAt = Date.now();
    /* back from the setup hotspot (the board still sends one status before it restarts) */
    if (d.status.online === true && d.rescueAt && Date.now() - d.rescueAt > 15000) d.rescueAt = 0;
  } else {
    d.events.push(text);
    if (d.events.length > 40) d.events.shift();
    if (d.journal) d.journal.push(text);
  }
  renderAll();
}
function liveOf(id) {
  if (!live.has(id)) live.set(id, { status: null, statusAt: 0, events: [] });
  return live.get(id);
}

function send(id, op, extra) {
  return new Promise((resolve) => {
    if (!client || !client.connected) { resolve({ ok: false, msg: "還沒連上雲端" }); return; }
    const r = rid();
    const body = Object.assign({ rid: r, ts: Math.floor(Date.now() / 1000), op }, extra || {});
    const timer = setTimeout(() => { pending.delete(r); resolve({ ok: false, msg: "板子沒有回應（可能離線）" }); }, CMD_TIMEOUT_MS);
    pending.set(r, { resolve, timer });
    client.publish("wakekey/" + id + "/cmd", JSON.stringify(body), { qos: 1 });
  });
}

function saveRegistry(list) {
  registry = list;
  client.publish(REG_TOPIC, JSON.stringify({ v: 1, devices: list }), { qos: 1, retain: true });
  renderAll();
}

/* ---------- what a board offers ---------- */
/* Boards publish wakekey/<id>/ui (retained): the buttons, settings and detail rows to show,
   see main/ui.c in the firmware repo. This page only knows the generic pieces below, so a new
   board feature needs no change here. Boards from before that get legacyUi(), which rebuilds
   what this page used to hard-code from their status message. */
const CONFIRMS = ["none", "twotap", "hold", "dialog"];
const FIELD_TYPES = ["bool", "range", "select", "text", "secret", "color"];
const INFO_CLS = ["ok", "warn", "bad", "muted"];
/* Ops that press keys on the computer or take the board offline are never a single tap,
   whatever a board's description says. */
const NEEDS_CONFIRM = ["unlock", "test_seq", "reboot", "unpair", "rescue", "set_usb_debug", "set_pin", "clear_pin"];
const SEQ_HINT = "按鍵過程在「詳細資料與紀錄」裡，大約 10–40 秒完成。";

function legacyUi(d) {
  const st = d.status || {}, seqs = d.seqs, has = (n) => !!(seqs && seqs.includes(n));
  const seqAction = (name, label, confirm, group, more) =>
    Object.assign({ id: "seq:" + name, label, op: "unlock", args: { seq: name }, confirm, group, done_hint: SEQ_HINT }, more);
  const actions = [{ id: "wake", label: "喚醒", op: "wake", confirm: "none", group: "main" }];
  if (!seqs || has("unlock")) actions.push(seqAction("unlock", "解鎖", "twotap", "main", { primary: true }));
  if (has("standby")) actions.push(seqAction("standby", "待機", "twotap", "more"));
  if (has("restart")) actions.push(seqAction("restart", "重新開機（長按）", "hold", "more",
    { ask: "重新開機", confirm_text: "電腦上沒存檔的資料會不見。" }));
  const settings = [], cfg = {};
  if (Array.isArray(st.btn)) {
    actions.push({ id: "rescue", label: "開設定熱點", op: "rescue", confirm: "dialog", group: "detail", ask: "開啟設定熱點",
      confirm_text: "板子會重開，熱點 WakeKey-Setup-XXXX 不用密碼，手機連上後開 http://192.168.4.1。\n熱點開著時板子離線（不連原本的 Wi-Fi），10 分鐘沒有裝置連上就會自動回去。" });
    settings.push({ id: "btn", label: "BOOT 按鈕", hint: "每下間隔 0.4 秒內算連按，存了立刻生效。指定解鎖流程時，任何人走到電腦旁連按都能解開它。",
      fields: [1, 2, 3].map((n) => ({ key: "btn" + n, type: "select", label: "點 " + n + " 下", options: "btn_actions" })),
      save: (v) => ["set_buttons", { btn: [v.btn1, v.btn2, v.btn3] }] });
    st.btn.forEach((a, i) => { cfg["btn" + (i + 1)] = a; });
  }
  if (typeof st.led === "number") {
    settings.push({ id: "led", label: "狀態燈", hint: "存了立刻生效。顏色在板子網頁的「設定 → 狀態燈」調整。",
      fields: [{ key: "led", type: "range", min: 0, max: 10, zero: "關", label: "亮度" }],
      save: (v) => ["set_led", { lvl: v.led }] });
    cfg.led = st.led;
  }
  if (typeof st.usbdbg === "boolean") {
    settings.push({ id: "usbdbg", label: "USB 除錯埠", hint: "關閉後只當純鍵盤；Modern Standby 筆電要這樣才叫得醒。",
      confirm_text: "改了之後板子會重新開機（約 20 秒離線）。",
      fields: [{ key: "usbdbg", type: "bool", label: "開啟 USB 除錯序列埠" }],
      save: (v) => ["set_usb_debug", { on: v.usbdbg }] });
    cfg.usbdbg = st.usbdbg_set;
  }
  const btnActions = [["none", "不動作"], ["wake", "喚醒"], ["lock", "鎖定電腦（Win+L）"]]
    .concat((seqs || []).map((n) => ["seq:" + n, "執行流程「" + n + "」"]), (st.btn || []).includes("seq:") ? [["seq:", "執行流程（已刪除）"]] : []);
  const info = [
    { label: "遠端喚醒", key: "rwake", map: { 1: "允許", 0: ["未允許", "bad"], "-1": ["尚未得知", "muted"] } },
    { label: "PIN", key: "pin", map: { true: "已設定", false: ["未設定", "muted"] } },
    { label: "最近一次", key: "last", empty: "—" },
    { label: "Wi-Fi", fmt: "{ssid}（{rssi} dBm）" },
    { label: "USB 除錯埠", key: "usbdbg", map: { true: "開", false: "關（純鍵盤）" }, pending: { key: "cfg.usbdbg", text: "（已改，重開機後生效）" } },
    { label: "BOOT 按鈕", lines: [1, 2, 3].map((n) => ({ prefix: n + " 下：", key: "cfg.btn" + n, options: "btn_actions" })) },
  ];
  return { v: 1, legacy: true, actions, settings, options: { btn_actions: btnActions }, info, cfg };
}

/* null while a board that has a description has not sent it yet */
function uiOf(d) {
  if (d.ui) return d.ui;
  const st = d.status;
  if (st && st.uirev === undefined) return legacyUi(d);
  return null;
}
/* status plus the current setting values, for "key" paths like "cfg.led" */
function viewOf(d, ui) { return Object.assign({}, d.status || {}, { cfg: (ui && ui.cfg) || ((d.status || {}).cfg) || {} }); }
function getPath(o, path) { return String(path).split(".").reduce((x, k) => (x == null ? undefined : x[k]), o); }
function confirmOf(a) {
  if (!CONFIRMS.includes(a.confirm)) return null;          /* needs a newer page */
  return a.confirm === "none" && NEEDS_CONFIRM.includes(a.op) ? "twotap" : a.confirm;
}
function optionList(ui, f) { return Array.isArray(f.options) ? f.options : ((ui.options || {})[f.options] || []); }
function optionLabel(list, v) { const o = list.find((x) => x[0] === v); return o ? o[1] : v; }
function infoText(it, ui, view) {
  const v = getPath(view, it.key);
  if (v === undefined || v === null || v === "") return null;
  const m = it.map && it.map[String(v)];
  let html;
  if (m !== undefined) {
    html = Array.isArray(m) ? (INFO_CLS.includes(m[1]) ? `<span class="${m[1]}">${esc(m[0])}</span>` : esc(m[0])) : esc(m);
  } else if (it.options) {
    html = esc(optionLabel(optionList(ui, it), v));
  } else {
    html = esc(it.fmt ? it.fmt.replace("{}", v) : v);
  }
  return html + esc(it.suffix || "");
}
function infoRow(it, ui, view) {
  let html;
  if (Array.isArray(it.lines)) {
    const parts = it.lines.map((l) => { const t = infoText(l, ui, view); return t === null ? null : esc(l.prefix || "") + t; }).filter((x) => x !== null);
    html = parts.length ? parts.join("<br>") : null;
  } else if (it.key) {
    html = infoText(it, ui, view);
  } else if (it.fmt) {
    html = esc(it.fmt.replace(/\{([\w.]+)\}/g, (_, k) => getPath(view, k) ?? ""));
  }
  if (html === null || html === undefined) {
    if (!it.empty) return "";
    html = `<span class="muted">${esc(it.empty)}</span>`;
  }
  if (it.pending) {
    const p = getPath(view, it.pending.key);
    if (p !== undefined && p !== getPath(view, it.key)) html += `<span class="muted">${esc(it.pending.text)}</span>`;
  }
  return `<dt>${esc(it.label)}</dt><dd>${html}</dd>`;
}

/* ---------- device cards ---------- */
const cards = new Map();   /* id -> element */
const results = new Map(); /* id -> {html, cls} kept across re-renders */
/* The big line under the name: what the computer is doing, and what to do about it. */
function stateOf(id, d, st) {
  let cls = "off", ic = ICON.cloudOff, t, s = "", extra = "";
  if (st.online !== true) {
    if (adding && adding.id === id) t = "等待板子第一次上線…";
    else if (d.rescueAt && Date.now() - d.rescueAt < 11 * 60000) {
      cls = "warn"; ic = ICON.wifi; t = "設定熱點開著";
      s = `手機連「${esc(d.rescueAp || st.ap || "WakeKey-Setup")}」（不用密碼）。改完按「結束熱點」，或 10 分鐘沒人連會自動回到原本的網路`;
    } else if (st.online === false) { t = "板子離線"; s = "斷電、沒網路，或正在重新開機"; }
    else t = "還沒收到板子的狀態";
  } else if (st.usb === "suspended" && st.rwake === 0) {
    cls = "warn"; ic = ICON.alert; t = "電腦睡眠中，這次叫不醒";
    if (st.usbdbg) {
      s = "電腦睡前沒有允許遠端喚醒：USB 除錯埠開著，Modern Standby 筆電要關掉";
      extra = '<button data-act="usbdbg-off">關閉 USB 除錯埠</button>';
    } else s = "電腦睡前沒有允許遠端喚醒（裝置管理員 → 這個鍵盤 → 允許此裝置喚醒電腦）";
  } else if (st.usb === "suspended") {
    cls = "sleep"; ic = ICON.moon; t = "電腦睡眠中";
    if (typeof st.slept === "number") t += " · " + fmtDur(st.slept + Math.max(0, (Date.now() - d.statusAt) / 1000));
  } else if (st.usb === "awake") {
    cls = "awake"; ic = ICON.monitor; t = "電腦醒著";
    if (st.busy) s = "正在執行按鍵流程…";
  } else { ic = ICON.plug; t = "板子沒接到電腦"; s = "USB 沒有連接，或電腦關機了"; }
  return { cls, html: `<div class="ic">${ic}</div><div><div class="t">${t}</div>` + (s ? `<div class="s">${s}</div>` : "") + extra + "</div>" };
}

/* ---------- journal timeline ---------- */
const TL_KINDS = [
  [/失敗|被拒|錯誤|沒有恢復|不允許|未允許|認證|鎖定/, "bad"],
  [/忽略|熱點/, "warn"],
  [/WakeKey 開機/, "boot"],
  [/suspend|睡眠|待機/, "sleep"],
  [/已喚醒|已送出|恢復|完成|已連線|OK|允許|掛載|resume/, "ok"],
];
function tlItem(line, today) {
  const m = String(line).match(/^(\d\d-\d\d) (\d\d:\d\d:\d\d)\s+(.*)$|^(\+\d+s)\s+(.*)$/);
  const when = !m ? "" : m[1] ? (m[1] === today ? m[2] : m[1] + " " + m[2].slice(0, 5)) : m[4];
  const text = (!m ? String(line) : m[1] ? m[3] : m[5]).replace(/^-+\s*|\s*-+$/g, "");
  const k = (TL_KINDS.find((r) => r[0].test(text)) || [0, ""])[1];
  return `<li data-k="${k}"><span class="k"></span><time>${esc(when)}</time><span>${esc(text)}</span></li>`;
}
function timelineHtml(d) {
  const lines = (d.journal || d.events).slice().reverse();
  if (!lines.length) return "";
  const n = new Date(), today = String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0");
  return lines.slice(0, d.tlAll ? lines.length : 12).map((l) => tlItem(l, today)).join("");
}
function cardFor(id) {
  if (cards.has(id)) return cards.get(id);
  const el = document.createElement("section");
  el.className = "card";
  el.innerHTML = `
    <div class="dev-head"><span class="dot"></span><div class="dev-name"></div><span class="pill"></span></div>
    <div class="state"></div>
    <div class="acts main"></div>
    <div class="acts more" hidden></div>
    <div class="result"></div>
    <details><summary>詳細資料與紀錄</summary>
      <dl class="facts"></dl>
      <div class="row"><span class="tools"></span><button data-act="journal">完整紀錄</button><button data-act="rename">改名稱</button><button data-act="remove">移除</button></div>
      <div class="forms"></div>
      <ul class="tl"></ul><div class="tl-empty"></div>
      <button class="link" data-act="tl-all" hidden>顯示全部紀錄</button>
    </details>`;
  el.addEventListener("click", (ev) => {
    const b = ev.target.closest("button");
    if (!b) return;
    if (b.dataset.a) doAction(id, b.dataset.a, b);
    else if (b.dataset.sec) toggleSection(id, b.dataset.sec);
    else if (b.dataset.save) saveSection(id, b.dataset.save, b);
    else if (b.dataset.cancel) toggleSection(id, b.dataset.cancel, false);
    else if (b.dataset.act) act(id, b.dataset.act, b);
  });
  cards.set(id, el);
  return el;
}
/* Long press (2 s, matches the CSS bar) before a destructive action; releasing early cancels. */
function holdButton(btn, fn) {
  let t = null;
  const stop = () => { clearTimeout(t); t = null; btn.classList.remove("hold"); };
  btn.addEventListener("pointerdown", (ev) => {
    if (btn.disabled) return;
    ev.preventDefault(); btn.classList.add("hold");
    t = setTimeout(() => { stop(); fn(); }, 2000);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach((e) => btn.addEventListener(e, stop));
  btn.addEventListener("contextmenu", (ev) => ev.preventDefault());
}
/* Boards without a description: which named sequences they have decides 解鎖 / 待機 / 重新開機. */
async function loadSeqs(id) {
  const d = liveOf(id);
  if (d.seqsLoading || d.seqs) return;
  d.seqsLoading = true;
  const r = await send(id, "get_seq");
  d.seqsLoading = false;
  if (r.ok && Array.isArray(r.seqs)) { d.seqs = r.seqs.map((s) => s.name).filter(Boolean); renderCard(id); }
}
/* Rebuild the buttons only when the description changes, so an armed or held button survives re-renders. */
function buildButtons(id, el, ui) {
  const key = ui ? JSON.stringify([ui.actions, ui.settings]) : "";
  if (el._uiKey === key) return;
  el._uiKey = key;
  el._ui = ui;
  const main = el.querySelector(".acts.main"), more = el.querySelector(".acts.more"), tools = el.querySelector(".tools");
  main.innerHTML = ""; more.innerHTML = ""; tools.innerHTML = "";
  el.querySelector(".forms").innerHTML = "";
  if (!ui) { main.innerHTML = '<div class="muted">讀取功能清單…</div>'; more.hidden = true; return; }
  (ui.actions || []).forEach((a) => {
    const b = document.createElement("button"), ic = actionIcon(a);
    const lm = a.label.match(/^(.+?)（(.+)）$/);     /* "重新開機（長按）": the note goes under the name */
    b._html = (ic ? `<span class="i">${ic}</span>` : "") + (lm ? esc(lm[1]) + `<small>${esc(lm[2])}</small>` : esc(a.label));
    b.innerHTML = b._html;
    b.dataset.label = a.label;
    if (a.primary) b.className = "primary";
    const c = confirmOf(a);
    if (!c) { b.dataset.unsupported = "1"; b.title = "需要更新控制頁"; }
    else if (c === "hold") holdButton(b, () => runConfirmed(id, a));
    else b.dataset.a = a.id;
    b._action = a;
    (a.group === "main" ? main : a.group === "more" ? more : tools).appendChild(b);
  });
  more.hidden = !more.children.length;
  (ui.settings || []).forEach((s) => {
    const b = document.createElement("button");
    b.textContent = s.label;
    b.dataset.sec = s.id;
    tools.appendChild(b);
  });
}
function renderCard(id) {
  const el = cardFor(id), d = live.get(id) || { status: null, events: [] }, st = d.status || {};
  const online = st.online === true;
  el.querySelector(".dot").className = "dot " + (online ? "on" : st.online === false ? "off" : "");
  el.querySelector(".dev-name").textContent = devName(id);
  const sv = stateOf(id, d, st), sEl = el.querySelector(".state");
  sEl.className = "state " + sv.cls;
  if (sEl._html !== sv.html) { sEl.innerHTML = sv.html; sEl._html = sv.html; }
  const pill = el.querySelector(".pill");
  pill.textContent = online ? (st.busy ? "執行中…" : "在線") : "離線";
  pill.className = "pill " + (online ? (st.busy ? "warn" : "ok") : "bad");
  if (online && !d.ui && st.uirev === undefined && !d.seqs) loadSeqs(id);
  const ui = uiOf(d);
  buildButtons(id, el, ui);
  el.querySelectorAll(".acts button, .tools button").forEach((b) => {
    if (b.classList.contains("arm")) return;
    const detail = !!b.dataset.sec || (b._action && b._action.group !== "main" && b._action.group !== "more");
    b.disabled = !online || !!b.dataset.unsupported || (!detail && !!st.busy);
  });
  if (!online) el.querySelector(".forms").innerHTML = "";
  const view = viewOf(d, ui);
  el.querySelector(".facts").innerHTML = `
    <dt>代號</dt><dd>${esc(id)}</dd>` + (online ? (ui ? (ui.info || []).map((it) => infoRow(it, ui, view)).join("") : "") + `
    <dt>韌體</dt><dd>${esc(st.ver)}${st.ts ? '　<span class="muted">狀態更新於 ' + ago(st.ts) + "</span>" : ""}</dd>` : "");
  const tl = timelineHtml(d), tlEl = el.querySelector(".tl");
  if (tlEl._html !== tl) { tlEl.innerHTML = tl; tlEl._html = tl; }
  el.querySelector(".tl-empty").textContent = tl ? "" : "還沒有紀錄。按「完整紀錄」讀取板子保存的紀錄。";
  el.querySelector("[data-act=tl-all]").hidden = !!d.tlAll || (d.journal || d.events).length <= 12;
  const r = results.get(id), rEl = el.querySelector(".result");
  rEl.className = "result" + (r ? " show " + (r.cls || "") : "");
  rEl.innerHTML = r ? r.html : "";
  return el;
}
function renderAll() {
  const box = $("devices");
  if (registry === null) { box.innerHTML = '<div class="card empty">讀取裝置清單…</div>'; return; }
  const ids = registry.map((x) => x.id);
  if (!ids.length) {
    box.innerHTML = '<div class="card empty">還沒有裝置。按下方「＋ 新增裝置」加入第一台。</div>';
  } else {
    const empty = box.querySelector(".empty"); if (empty) empty.remove();
    ids.forEach((id) => box.appendChild(renderCard(id)));   /* appendChild keeps the list in registry order */
    [...cards.keys()].forEach((id) => { if (!ids.includes(id)) { cards.get(id).remove(); cards.delete(id); } });
  }
  const found = [...live.entries()].filter(([id, d]) => !ids.includes(id) && d.status && d.status.online === true);
  $("foundCard").hidden = !found.length;
  $("found").innerHTML = found.map(([id, d]) =>
    `<div class="found"><span class="dot on"></span><span><b>${esc(id)}</b> <span class="muted">${esc(d.status.ssid || "")}</span></span><button class="primary" data-add="${esc(id)}">加入</button></div>`).join("");
}
$("found").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-add]");
  if (!b) return;
  const id = b.dataset.add;
  const name = await sheet({ title: "加入「" + id + "」", text: "幫這台取個名字，例如：公司筆電、家裡筆電。", input: id, ok: "加入" });
  if (!name) return;
  saveRegistry(registry.concat([{ id, name }]));
});
/* Two taps for anything that presses keys on the computer: first tap arms, second runs. */
function armOrRun(btn, label, fn) {
  const restore = () => { btn.classList.remove("arm"); btn.innerHTML = btn._html || esc(label); };
  if (btn.classList.contains("arm")) {
    clearTimeout(btn._t); restore(); fn();
    return;
  }
  btn.classList.add("arm"); btn.textContent = "再按一次確認";
  btn._t = setTimeout(restore, ARM_MS);
}
function doAction(id, aid, btn) {
  const a = btn._action;
  if (!a || a.id !== aid) return;
  const c = confirmOf(a);
  if (c === "twotap") armOrRun(btn, btn.dataset.label, () => runAction(id, a));
  else if (c === "dialog") runConfirmed(id, a);
  else if (c === "none") runAction(id, a);
}
/* hold and dialog: ask first when the board gave a reason (hold), always for dialog */
async function runConfirmed(id, a) {
  if (a.confirm === "dialog" || a.confirm_text) {
    const danger = a.confirm === "hold" || ["reboot", "unpair"].includes(a.op);
    if (!(await sheet({ title: (a.ask || a.label) + "「" + devName(id) + "」？", text: a.confirm_text, ok: a.ask || a.label, danger }))) return;
  }
  runAction(id, a);
}
function stepsHtml(steps) {
  return '<ul class="steps">' + steps.map((s) =>
    `<li class="${s.s}"><span class="m"></span><span>${esc(s.t)}</span><span class="x">${esc(s.x || "")}</span></li>`).join("") + "</ul>";
}
function rescueGuide(ap) {
  return `<b>設定熱點大約 15 秒後出現</b><ol class="guide">
    <li>手機 Wi-Fi 連「${esc(ap || "WakeKey-Setup-XXXX")}」，不用密碼。</li>
    <li>連上後通常會自動跳出設定頁；沒有的話，點通知「登入網路」，或用瀏覽器開 <b>http://192.168.4.1</b>（Android 打不開時先關掉行動數據）。</li>
    <li>輸入板子網頁的密碼，改好後按「結束熱點」。</li></ol>
    <div class="hint">10 分鐘沒有裝置連上，板子會自動回到原本的網路。</div>`;
}
/* Wake with a live progress: sent → the board woke the computer → the computer reports awake. */
async function runWake(id) {
  const d = liveOf(id), t0 = Date.now();
  const steps = [{ t: "送到板子", s: "run" }, { t: "板子送出喚醒", s: "wait" }, { t: "電腦醒來", s: "wait" }];
  const show = (cls, foot) => { results.set(id, { html: stepsHtml(steps) + (foot || ""), cls: cls || "" }); renderCard(id); };
  d.cancelWake = false;
  show();
  let r = await send(id, "wake");
  /* refused because the computer has only just gone to sleep: count down, then send again */
  for (let tries = 0; !r.ok && tries < (r.retry_max || 2); tries++) {
    let wait = r.retry_after;
    if (wait === undefined && /剛進入睡眠/.test(r.msg || "")) wait = 10;   /* boards from before retry_after */
    if (!(wait > 0)) break;
    steps[0].s = "ok"; steps[1].s = "warn";
    for (; wait > 0 && !d.cancelWake; wait--) {
      steps[1].x = wait + " 秒";
      show("warn", '<div class="hint">電腦剛睡著，要等它完全進入睡眠才叫得醒；倒數完會自動再送。</div>' +
        '<div class="row"><button data-act="cancel-wake">取消</button></div>');
      await sleep(1000);
    }
    if (d.cancelWake) { steps[1].s = "bad"; steps[1].x = "已取消"; show("bad"); return; }
    steps[1].s = "run"; steps[1].x = ""; show();
    r = await send(id, "wake");
  }
  if (!r.ok) {
    if (/沒有回應|還沒連上/.test(r.msg || "")) steps[0].s = "bad";
    else { steps[0].s = "ok"; steps[1].s = "bad"; }
    show("bad", `<div class="msg">${esc(r.msg)}</div>`);
    return;
  }
  steps[0].s = steps[1].s = "ok";
  steps[1].x = ((Date.now() - t0) / 1000).toFixed(1) + " 秒";
  if (/原本醒著/.test(r.msg)) {
    steps[2] = { t: "電腦本來就醒著，已按一下鍵", s: "ok" };
    show("ok"); vibrate();
    return;
  }
  steps[2].s = "run"; show();
  const sent = Date.now();
  let awake = false;
  for (let ms = 0; ms < 30000 && !awake; ms += 250) {
    const st = liveOf(id).status || {};
    awake = st.usb === "awake" && liveOf(id).statusAt >= t0;
    if (ms % 1000 === 0) { steps[2].x = Math.round(ms / 1000) + " 秒"; show(); }
    if (!awake) await sleep(250);
  }
  if (awake) {
    steps[2].s = "ok"; steps[2].x = ((Date.now() - sent) / 1000).toFixed(1) + " 秒";
    show("ok"); vibrate();
  } else {
    steps[2] = { t: "還沒收到電腦醒來的狀態", s: "warn" };
    show("warn", '<div class="hint">板子已送出喚醒，但 30 秒內電腦沒有回報醒來。可以再按一次「喚醒」，或打開「詳細資料與紀錄」看紀錄。</div>');
  }
}
async function runAction(id, a) {
  if (a.op === "wake") return runWake(id);
  results.set(id, { html: stepsHtml([{ t: "送到板子", s: "run" }]) }); renderCard(id);
  const r = await send(id, a.op, a.args);
  if (r.ok && a.op === "rescue") {
    const d = liveOf(id);
    d.rescueAt = Date.now(); d.rescueAp = r.ap || (d.status || {}).ap;
    results.set(id, { html: rescueGuide(d.rescueAp) });
  } else {
    results.set(id, {
      html: (r.ok ? "✓ " : "✗ ") + esc(r.msg) + (r.ok && a.done_hint ? '<div class="hint">' + esc(a.done_hint) + "</div>" : ""),
      cls: r.ok ? "ok" : "bad",
    });
    if (r.ok) vibrate();
  }
  renderCard(id);
}

/* ---------- settings forms ---------- */
function rangeText(f, v) { return v === 0 && f.zero ? f.zero : v + " / " + f.max; }
function fieldHtml(ui, f, v) {
  const k = `data-k="${esc(f.key)}" data-t="${esc(f.type)}"`;
  switch (f.type) {
    case "bool":
      return `<label class="check"><input type="checkbox" ${k}${v ? " checked" : ""}> ${esc(f.label)}</label>`;
    case "range": {
      const n = typeof v === "number" ? v : (f.min || 0);
      return `<label>${esc(f.label)}：<b class="lvl">${esc(rangeText(f, n))}</b></label>` +
        `<input type="range" ${k} min="${+f.min || 0}" max="${+f.max || 0}" step="${+f.step || 1}" value="${n}">`;
    }
    case "select": {
      const list = optionList(ui, f), opts = list.some((o) => o[0] === v) || v === undefined ? list : list.concat([[v, v]]);
      return `<label>${esc(f.label)}</label><select ${k}>` +
        opts.map((o) => `<option value="${esc(o[0])}"${o[0] === v ? " selected" : ""}>${esc(o[1])}</option>`).join("") + "</select>";
    }
    case "text":
      return `<label>${esc(f.label)}</label><input type="text" ${k} value="${esc(v)}"${f.max ? ' maxlength="' + (+f.max) + '"' : ""} autocomplete="off">`;
    case "secret":
      return `<label>${esc(f.label)}</label><input type="password" ${k} autocomplete="new-password" placeholder="留空＝不變更">`;
    case "color":
      return `<label class="color"><input type="color" ${k} value="${esc(/^#[0-9a-f]{6}$/i.test(v || "") ? v : "#000000")}"> ${esc(f.label)}</label>`;
  }
  return `<p class="muted">「${esc(f.label)}」需要更新控制頁才能設定。</p>`;
}
function toggleSection(id, sid, open) {
  const el = cardFor(id), ui = uiOf(liveOf(id)) || el._ui, s = ui && (ui.settings || []).find((x) => x.id === sid);
  const forms = el.querySelector(".forms"), cur = forms.dataset.sec;
  forms.innerHTML = ""; delete forms.dataset.sec;
  if (!s || open === false || cur === sid) return;
  const cfg = viewOf(liveOf(id), ui).cfg;
  forms.dataset.sec = sid;
  forms.innerHTML = `<div class="secform"><h2>${esc(s.label)}</h2>` +
    (s.fields || []).map((f) => fieldHtml(ui, f, cfg[f.key])).join("") +
    (s.hint ? `<p class="muted">${esc(s.hint)}</p>` : "") +
    `<div class="row"><button class="primary" data-save="${esc(sid)}">儲存</button><button data-cancel="${esc(sid)}">取消</button></div></div>`;
  forms.querySelectorAll("input[type=range]").forEach((r) => {
    const f = s.fields.find((x) => x.key === r.dataset.k);
    r.addEventListener("input", () => { r.previousElementSibling.querySelector(".lvl").textContent = rangeText(f, +r.value); });
  });
}
async function saveSection(id, sid, btn) {
  const el = cardFor(id), ui = uiOf(liveOf(id)) || el._ui, s = ui && (ui.settings || []).find((x) => x.id === sid);
  if (!s) return;
  const cfg = viewOf(liveOf(id), ui).cfg, all = {}, changed = {};
  el.querySelectorAll(".forms [data-k]").forEach((i) => {
    const t = i.dataset.t, k = i.dataset.k;
    const v = t === "bool" ? i.checked : t === "range" ? +i.value : i.value;
    if (t === "secret" && !v) return;
    all[k] = v;
    if (t === "secret" || v !== cfg[k]) changed[k] = v;
  });
  if (!Object.keys(changed).length) {
    results.set(id, { html: "沒有變更", cls: "" });
    toggleSection(id, sid, false); renderCard(id);
    return;
  }
  if (s.confirm_text && !(await sheet({ title: s.label + "（" + devName(id) + "）", text: s.confirm_text, ok: "儲存" }))) return;
  btn.disabled = true;
  const [op, extra] = s.save ? s.save(Object.assign({}, cfg, all)) : ["set", { section: sid, values: changed }];
  const r = await send(id, op, extra);
  btn.disabled = false;
  results.set(id, { html: (r.ok ? "✓ " : "✗ ") + esc(r.msg), cls: r.ok ? "ok" : "bad" });
  if (r.ok) toggleSection(id, sid, false);
  renderCard(id);
}

/* ---------- card buttons the page itself owns ---------- */
async function act(id, what, btn) {
  const d = liveOf(id);
  if (what === "journal") {
    btn.disabled = true;
    const r = await send(id, "journal");
    btn.disabled = false;
    if (r.ok) { d.journal = (r.lines || []).concat(); d.tlAll = true; }
    else results.set(id, { html: "✗ " + esc(r.msg), cls: "bad" });
    renderCard(id);
    return;
  }
  if (what === "tl-all") { d.tlAll = true; renderCard(id); return; }
  if (what === "cancel-wake") { d.cancelWake = true; return; }
  if (what === "usbdbg-off") {
    if (!(await sheet({ title: "關閉 USB 除錯埠（" + devName(id) + "）", ok: "關閉並重新開機",
      text: "板子會重新開機（約 20 秒離線），之後只當純鍵盤，下次睡眠就叫得醒。\n睡著的電腦可能會被叫醒一下又回去睡。" }))) return;
    const r = d.ui ? await send(id, "set", { section: "usbdbg", values: { usbdbg: false } }) : await send(id, "set_usb_debug", { on: false });
    results.set(id, { html: (r.ok ? "✓ " : "✗ ") + esc(r.msg), cls: r.ok ? "ok" : "bad" });
    renderCard(id);
    return;
  }
  if (what === "rename") {
    const name = await sheet({ title: "改名稱", input: devName(id), ok: "儲存" });
    if (!name) return;
    saveRegistry(registry.map((x) => (x.id === id ? { id, name } : x)));
    return;
  }
  if (what === "remove") {
    if (!(await sheet({ title: "把「" + devName(id) + "」從清單移除？", ok: "移除", danger: true,
      text: "板子本身和它的雲端帳號不會被刪除；要徹底移除，請另外到 EMQX 刪掉帳號「" + id + "」。" }))) return;
    results.delete(id);
    saveRegistry(registry.filter((x) => x.id !== id));
    /* clear its retained messages so it does not show up again under 發現的裝置 until it reconnects */
    client.publish("wakekey/" + id + "/status", "", { qos: 1, retain: true });
    client.publish("wakekey/" + id + "/ui", "", { qos: 1, retain: true });
    live.delete(id);
    renderAll();
  }
}

/* ---------- add device ---------- */
$("addBtn").onclick = () => { adding = { stage: 1 }; renderAdd(); };

function renderAdd() {
  const c = $("addCard");
  if (!adding) { c.hidden = true; c.innerHTML = ""; $("addBtn").hidden = false; return; }
  c.hidden = false; $("addBtn").hidden = true;
  if (adding.stage === 1) {
    c.innerHTML = `
      <h2>新增裝置</h2>
      <label for="aName">名稱（顯示用）</label>
      <input type="text" id="aName" placeholder="例如：家裡筆電">
      <label for="aId">代號（英文小寫、數字、-，2–16 字；之後不能改）</label>
      <input type="text" id="aId" autocapitalize="off" spellcheck="false" placeholder="例如：home">
      <label class="radio"><input type="radio" name="aKind" value="new" checked><span><b>新的板子</b>：產生雲端帳號和配對碼</span></label>
      <label class="radio"><input type="radio" name="aKind" value="old"><span><b>已經配對過的板子</b>：只加到清單（雲端帳號已經存在）</span></label>
      <div class="result" id="aMsg"></div>
      <div class="row"><button id="aCancel">取消</button><button class="primary" id="aNext">下一步</button></div>`;
    $("aCancel").onclick = () => { adding = null; renderAdd(); };
    $("aNext").onclick = () => {
      const name = $("aName").value.trim(), id = $("aId").value.trim().toLowerCase();
      const kind = c.querySelector("input[name=aKind]:checked").value;
      const msg = $("aMsg");
      const bad = (t) => { msg.className = "result show bad"; msg.textContent = t; };
      if (!name) return bad("請填名稱");
      if (!ID_RE.test(id)) return bad("代號只能用英文小寫、數字和 -，2–16 字，開頭不能是 -");
      if (id === "wk-admin") return bad("這個代號保留給控制網頁");
      if (registry.some((x) => x.id === id)) return bad("清單裡已經有這個代號");
      saveRegistry(registry.concat([{ id, name }]));
      if (kind === "old") { adding = null; renderAdd(); return; }
      const pw = randomPassword(24);
      adding = { stage: 2, id, name, pw, code: pairingCode(login.host, id, pw) };
      renderAdd();
    };
    return;
  }
  const a = adding, online = (live.get(a.id) || {}).status?.online === true;
  c.innerHTML = `
    <h2>新增「${esc(a.name)}」</h2>
    <div class="hint" style="margin-top:0">這頁的密碼只顯示這一次。照順序做完再關掉。</div>
    <div class="step"><b class="n">1</b><b>在 EMQX 建立這台的帳號</b>
      <div class="hint">登入 <a href="https://cloud-intl.emqx.com/console/" target="_blank" rel="noopener">EMQX 控制台</a> → 你的部署 → 「存取控制」→「認證」→「使用者」→ 新增，填入：</div>
      <div class="copy"><span class="muted">帳號</span><code>${esc(a.id)}</code><button data-copy="${esc(a.id)}">複製</button></div>
      <div class="copy"><span class="muted">密碼</span><code>${esc(a.pw)}</code><button data-copy="${esc(a.pw)}">複製</button></div>
      <div class="hint">權限不用另外設：每個帳號本來就只能用自己的 wakekey/代號/ 頻道。</div>
    </div>
    <div class="step"><b class="n">2</b><b>把配對碼存進板子</b>
      <div class="hint">板子連上 Wi-Fi 後，用同一個網路打開板子的網頁 → 「設定」→「雲端（MQTT）」→ 貼上配對碼 → 儲存配對碼。</div>
      <div class="copy"><code>${esc(a.code)}</code><button data-copy="${esc(a.code)}">複製</button></div>
      <div class="qr" id="aQr"></div>
    </div>
    <div class="step"><b class="n">3</b><b>等板子上線</b>
      <div class="hint">${online ? '<span class="ok">✓ 已上線，可以按「完成」</span>' : "板子儲存配對碼後約 20 秒會出現在上面的清單，狀態變成「在線」。"}</div>
    </div>
    <div class="row"><button class="primary" id="aDone">完成</button></div>`;
  c.querySelectorAll("button[data-copy]").forEach((b) => { b.onclick = () => copy(b.dataset.copy, b); });
  try { new QRCode($("aQr"), { text: a.code, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.L }); } catch (e) { $("aQr").remove(); }
  $("aDone").onclick = async () => {
    if (!online && !(await sheet({ title: "板子還沒上線，確定關掉？", ok: "關掉", danger: true,
      text: "現在關掉的話，這組密碼和配對碼就看不到了，要重來得先在 EMQX 刪掉帳號。" }))) return;
    adding = null; renderAdd(); renderAll();
  };
}
/* refresh the wizard's "等板子上線" line when that device comes online */
setInterval(() => {
  if (adding && adding.stage === 2 && (live.get(adding.id) || {}).status?.online === true && !adding.seenOnline) {
    adding.seenOnline = true; renderAdd();
  }
}, 1000);

/* ---------- login / logout ---------- */
function showLogin(msg, prefill) {
  $("login").hidden = false; $("app").hidden = true; $("foot").hidden = true;
  const saved = prefill || loadLogin();
  if (saved) {
    $("host").value = saved.host || ""; $("user").value = saved.user || "wk-admin";
    $("pass").value = saved.pass || "";      /* 登出 keeps the saved password: just press 連線 */
  }
  $("remember").checked = loadLogin() ? true : $("remember").checked;
  const m = $("loginMsg");
  m.className = "result" + (msg ? " show bad" : ""); m.textContent = msg || "";
  setConn("");
}

$("loginForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const l = { host: normHost($("host").value), user: $("user").value.trim(), pass: $("pass").value };
  $("host").value = l.host;
  if ($("remember").checked) saveLogin(l); else clearLogin();
  $("pass").value = "";
  connect(l, false);
});
function disconnect() {
  if (client) client.end(true);
  client = null; registry = null; adding = null;
  live.clear(); cards.clear(); results.clear();
  $("devices").innerHTML = ""; renderAdd();
}
$("logout").onclick = () => { disconnect(); showLogin(); };
$("forget").onclick = () => { clearLogin(); disconnect(); $("pass").value = ""; showLogin(); $("pass").value = ""; };
setInterval(() => { if (registry) registry.forEach((x) => renderCard(x.id)); }, 30000);

/* Back from the background (phone app switch, screen on): the socket is often dead
   while the client still thinks it is connected, so reconnect at once instead of
   waiting up to a keepalive; the retained statuses then refresh every card. */
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (!login || !client) return;
  if (!client.connected || Date.now() - hiddenAt > 15000) connect(login, true, true);
  if (registry) registry.forEach((x) => renderCard(x.id));
});

/* Opens instantly and offline from the copy sw.js keeps (GitHub Pages is https). */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

const saved = loadLogin();
if (saved && saved.pass) connect(saved, true); else showLogin();
</script>
