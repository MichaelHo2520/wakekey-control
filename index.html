<!doctype html>
<html lang="zh-Hant" data-theme="aurora" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef0f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WakeKey">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>WakeKey</title>
<!-- Static page: no secrets in here. The broker address and the wk-admin password are
     typed in on first use and, if the user asks, kept in this browser only. The device
     list lives on the broker as a retained message only wk-admin can read. -->
<script>
/* Apply the saved look before the first paint (no flash of the wrong theme). */
(function () {
  try {
    var v = JSON.parse(localStorage.getItem("wakekey.look.v1") || "{}"), h = document.documentElement;
    if (/^(aurora|ocean|sunset|graphite)$/.test(v.theme)) h.dataset.theme = v.theme;
    var dark = v.mode === "dark" || (v.mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    h.dataset.scheme = dark ? "dark" : "light";
  } catch (e) {}
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ======================= tokens ======================= */
:root {
  --r-xl: 30px; --r-lg: 24px; --r-md: 18px; --r-sm: 13px;
  --ok: #16a34a; --warn: #d97706; --bad: #e11d48; --sleep: #6d5dfc;
  font-synthesis: none;
}
html[data-theme=aurora]   { --a1: #7b61ff; --a2: #1fb6e8; --a3: #ff6fb5; }
html[data-theme=ocean]    { --a1: #1d6ff2; --a2: #12c2b8; --a3: #5865f2; }
html[data-theme=sunset]   { --a1: #f2542d; --a2: #e8367a; --a3: #ffb02e; }
html[data-theme=graphite] { --a1: #3f4654; --a2: #6b7280; --a3: #9aa3b2; }
html[data-scheme=light] {
  color-scheme: light; --blob: .85;
  --base: #eef0f7; --text: #0d0f1a; --muted: rgba(13, 15, 26, .56); --faint: rgba(13, 15, 26, .36);
  --glass: rgba(255, 255, 255, .5); --glass-2: rgba(255, 255, 255, .42); --glass-3: rgba(255, 255, 255, .7);
  --edge: rgba(255, 255, 255, .78); --hi: rgba(255, 255, 255, .95); --sheen: rgba(255, 255, 255, .6);
  --shadow: rgba(30, 36, 80, .13); --line: rgba(13, 15, 26, .08); --solid: #f7f8fc;
  --field: rgba(255, 255, 255, .65);
}
html[data-scheme=dark] {
  color-scheme: dark;
  --base: #05060b; --text: #f3f4f8; --muted: rgba(235, 236, 245, .6); --faint: rgba(235, 236, 245, .38);
  --glass: rgba(30, 32, 44, .5); --glass-2: rgba(255, 255, 255, .07); --glass-3: rgba(255, 255, 255, .12);
  --edge: rgba(255, 255, 255, .13); --hi: rgba(255, 255, 255, .2); --sheen: rgba(255, 255, 255, .08);
  --shadow: rgba(0, 0, 0, .5); --line: rgba(255, 255, 255, .08); --solid: #161822; --blob: .55;
  --field: rgba(0, 0, 0, .25);
  --ok: #34d399; --warn: #fbbf24; --bad: #fb7185; --sleep: #a5a0ff;
}
html[data-scheme=dark][data-theme=graphite] { --a1: #8b93a3; --a2: #c2c8d2; --a3: #5b6475; }

/* ======================= base ======================= */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--base); }
body {
  margin: 0; min-height: 100dvh; color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  padding: max(10px, env(safe-area-inset-top)) 14px max(28px, env(safe-area-inset-bottom));
}
a { color: inherit; text-decoration: none; }
svg { display: block; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* soft color field behind the glass */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg i { position: absolute; width: 75vmax; height: 75vmax; border-radius: 50%; opacity: var(--blob); }
.bg .b1 { background: radial-gradient(circle, var(--a1) 0, transparent 64%); top: -26vmax; left: -24vmax; animation: drift1 26s ease-in-out infinite alternate; }
.bg .b2 { background: radial-gradient(circle, var(--a2) 0, transparent 64%); bottom: -28vmax; right: -26vmax; animation: drift2 30s ease-in-out infinite alternate; }
.bg .b3 { background: radial-gradient(circle, var(--a3) 0, transparent 62%); top: 22%; left: 30%; width: 60vmax; height: 60vmax; opacity: calc(var(--blob) * .7); animation: drift3 34s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(8vmax, 6vmax) scale(1.08); } }
@keyframes drift2 { to { transform: translate(-7vmax, -5vmax) scale(1.1); } }
@keyframes drift3 { to { transform: translate(-10vmax, 8vmax) scale(.92); } }

/* ======================= glass ======================= */
.glass {
  background: linear-gradient(145deg, var(--sheen) 0%, transparent 42%), var(--glass);
  -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%);
  border: 1px solid var(--edge); border-radius: var(--r-xl);
  box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 0 rgba(255, 255, 255, .04), 0 12px 36px var(--shadow);
}
.inset { background: var(--glass-2); border: 1px solid var(--line); border-radius: var(--r-md); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--solid); } }
@media (prefers-reduced-transparency: reduce) { .glass { background: var(--solid); backdrop-filter: none; -webkit-backdrop-filter: none; } }
@media (prefers-reduced-motion: reduce) { .bg i { animation: none; } *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ======================= controls ======================= */
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; border: 0; background: none; padding: 0; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }
.ib { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--text);
  background: var(--glass-3); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 var(--hi); transition: transform .12s; }
.ib svg { width: 21px; height: 21px; }
.ib:active { transform: scale(.92); }
.gbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 99px; font-weight: 600;
  background: var(--glass-3); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 var(--hi), 0 4px 14px var(--shadow); transition: transform .12s, opacity .2s; }
.gbtn svg { width: 19px; height: 19px; }
.gbtn:active:not(:disabled) { transform: scale(.97); }
.gbtn.primary { color: #fff; border-color: rgba(255, 255, 255, .35);
  background: linear-gradient(160deg, rgba(255, 255, 255, .28), transparent 55%), linear-gradient(135deg, var(--a1), var(--a2)); }
.gbtn.danger { color: #fff; border-color: rgba(255, 255, 255, .3); background: linear-gradient(160deg, rgba(255, 255, 255, .25), transparent 55%), linear-gradient(135deg, #f43f5e, #e11d48); }
.gbtn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--muted); }
.gbtn.wide { width: 100%; padding: 15px; font-size: 1.02rem; }
input[type=text], input[type=password], select {
  width: 100%; padding: 12px 14px; font: inherit; color: var(--text); border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--field); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .06); }
input[type=range] { width: 100%; accent-color: var(--a1); }
label.f { display: block; font-size: .85rem; color: var(--muted); margin: 14px 0 6px; }
.switch { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; cursor: pointer; }
.switch input { position: absolute; opacity: 0; }
.switch i { width: 50px; height: 30px; border-radius: 99px; background: var(--line); flex: none; position: relative; transition: background .2s; box-shadow: inset 0 0 0 1px var(--line); }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); transition: transform .2s; }
.switch input:checked + i { background: linear-gradient(135deg, var(--a1), var(--a2)); }
.switch input:checked + i::after { transform: translateX(20px); }
.switch input:focus-visible + i { outline: 2px solid var(--a1); outline-offset: 2px; }

/* ======================= header ======================= */
.top { position: sticky; top: max(10px, env(safe-area-inset-top)); z-index: 10; display: flex; align-items: center; gap: 8px;
  padding: 7px 8px 7px 12px; border-radius: 99px; max-width: 1120px; margin: 0 auto 18px; }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; font-weight: 700; font-size: 1.08rem; letter-spacing: .01em; }
.brand img { width: 28px; height: 28px; border-radius: 8px; box-shadow: 0 2px 8px var(--shadow); flex: none; }
.brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top #back { margin-left: -4px; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); white-space: nowrap; }
.conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.conn.ok::before { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.conn.warn::before { background: var(--warn); } .conn.bad::before { background: var(--bad); }
.conn.ok b { display: none; }
.conn b { font-weight: 500; }
.spacer { flex: 1; }
.themes { display: flex; gap: 6px; padding: 4px; border-radius: 99px; background: var(--glass-2); border: 1px solid var(--line); }
.sw { width: 24px; height: 24px; border-radius: 50%; position: relative; background: linear-gradient(135deg, var(--s1), var(--s2)); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .5), 0 1px 3px rgba(0, 0, 0, .2); transition: transform .15s; }
.sw[aria-checked=true] { box-shadow: 0 0 0 2px var(--base), 0 0 0 4px var(--s1); }
.sw:active { transform: scale(.88); }
.top .ib { width: 36px; height: 36px; }
.top .ib svg { width: 19px; height: 19px; }

/* ======================= layout ======================= */
main { max-width: 1120px; margin: 0 auto; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 460px)); justify-content: center; align-items: start; }
.narrow { max-width: 560px; margin: 0 auto; }
.view { animation: viewin .25s ease-out; }
@keyframes viewin { from { opacity: 0; transform: translateY(6px); } }
.home-foot { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }

/* ======================= device card ======================= */
.dev { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.dev-h { display: flex; align-items: center; gap: 10px; padding: 2px 2px 0 6px; }
.dev-h h2 { margin: 0; font-size: 1.18rem; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: .74rem; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--glass-2); border: 1px solid var(--line); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); }

/* status readout, not a control: no box and a flat round icon, so it can't be mistaken for the buttons below */
.hero { display: flex; align-items: center; gap: 12px; padding: 0 6px 14px; border-bottom: 1px solid var(--line); --sc: var(--muted); }
.hero.awake { --sc: var(--ok); } .hero.sleep { --sc: var(--sleep); } .hero.warn { --sc: var(--warn); }
.hero .orb { width: 40px; height: 40px; border-radius: 50%; color: var(--sc); background: color-mix(in srgb, var(--sc) 16%, transparent); box-shadow: none; }
.hero .orb svg { width: 22px; height: 22px; }
.hero-t small { display: block; font-size: .72rem; font-weight: 600; color: var(--faint); letter-spacing: .06em; }
.hero.awake .hero-t b, .hero.sleep .hero-t b, .hero.warn .hero-t b { color: var(--sc); }
.orb { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; color: #fff; flex: none;
  background: linear-gradient(160deg, rgba(255, 255, 255, .35), transparent 50%), var(--og, linear-gradient(135deg, #9aa3b2, #6b7280));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 8px 20px -6px var(--oc, rgba(0, 0, 0, .3)); }
.orb svg { width: 30px; height: 30px; }
.orb.awake { --og: linear-gradient(135deg, #34d399, #059669); --oc: rgba(5, 150, 105, .55); }
.orb.sleep { --og: linear-gradient(135deg, #8b7cff, #4f46e5); --oc: rgba(79, 70, 229, .55); }
.orb.warn  { --og: linear-gradient(135deg, #fbbf24, #ea580c); --oc: rgba(234, 88, 12, .5); }
.orb.off   { --og: linear-gradient(135deg, #a1a8b5, #6b7280); --oc: rgba(0, 0, 0, .25); }
.hero-t { min-width: 0; flex: 1; }
.hero-t b { display: block; font-size: 1.12rem; letter-spacing: .01em; }
.hero-t span { display: block; font-size: .84rem; color: var(--muted); margin-top: 1px; }
.hero .gbtn { margin-top: 8px; padding: 8px 14px; font-size: .86rem; }

.acts-main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.act { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r-lg); text-align: left; position: relative; overflow: hidden;
  background: var(--glass-3); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 var(--hi), 0 6px 18px -8px var(--shadow); transition: transform .12s, background .2s; }
.act:active:not(:disabled) { transform: scale(.97); }
.act .lbl { font-weight: 700; font-size: 1.05rem; }
.tile { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: #fff; flex: none;
  background: linear-gradient(160deg, rgba(255, 255, 255, .35), transparent 52%), var(--tg, linear-gradient(135deg, var(--a1), var(--a2)));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 6px 14px -6px var(--tc, rgba(0, 0, 0, .35)); }
.tile svg { width: 24px; height: 24px; }
.t-sun  { --tg: linear-gradient(135deg, #ffc23d, #fb7d10); --tc: rgba(251, 125, 16, .6); }
.t-key  { --tg: linear-gradient(135deg, var(--a1), var(--a2)); --tc: color-mix(in srgb, var(--a1) 60%, transparent); }
.t-moon { --tg: linear-gradient(135deg, #8b7cff, #4f46e5); --tc: rgba(79, 70, 229, .6); }
.t-red  { --tg: linear-gradient(135deg, #fb7185, #e11d48); --tc: rgba(225, 29, 72, .55); }
.t-teal { --tg: linear-gradient(135deg, #2dd4bf, #0284c7); --tc: rgba(2, 132, 199, .55); }
.t-amber{ --tg: linear-gradient(135deg, #fbbf24, #ea580c); --tc: rgba(234, 88, 12, .5); }
.t-gray { --tg: linear-gradient(135deg, #a1a8b5, #5b6475); --tc: rgba(0, 0, 0, .3); }

.acts-quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chip { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 2px; border-radius: var(--r-md); position: relative; }
.chip .ci { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; color: var(--tcol, var(--text)); position: relative;
  background: var(--glass-3); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 var(--hi), 0 6px 16px -8px var(--shadow); transition: transform .12s; }
.chip .ci svg { width: 23px; height: 23px; }
.chip span.l { font-size: .78rem; font-weight: 600; line-height: 1.15; text-align: center; }
.chip small { display: block; font-size: .66rem; color: var(--muted); font-weight: 500; }
.chip:active:not(:disabled) .ci { transform: scale(.92); }
.chip.c-moon { --tcol: var(--sleep); } .chip.c-red { --tcol: var(--bad); } .chip.c-teal { --tcol: #0ea5e9; } .chip.c-sun { --tcol: #f59e0b; } .chip.c-key { --tcol: var(--a1); }
/* two-tap arm and long press */
.act.arm, .chip.arm .ci { background: linear-gradient(135deg, #f59e0b, #ea580c); color: #fff; border-color: transparent; }
.act.arm .tile { background: rgba(255, 255, 255, .25); box-shadow: none; }
.chip .ring { position: absolute; inset: -4px; border-radius: 50%; pointer-events: none; opacity: 0; }
.chip.hold .ring { opacity: 1; background: conic-gradient(var(--bad) calc(var(--p, 0) * 1%), transparent 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); }

/* result / progress */
.result { padding: 12px 14px; border-radius: var(--r-md); background: var(--glass-2); border: 1px solid var(--line); font-size: .9rem; }
.result.ok { border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.result.bad { border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.result.warn { border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.result .msg { margin-top: 8px; color: var(--muted); }
.result .gbtn { margin-top: 10px; padding: 8px 14px; font-size: .86rem; }
.line { display: flex; align-items: center; gap: 8px; }
.line svg { width: 18px; height: 18px; flex: none; }
.line.ok { color: var(--ok); } .line.bad { color: var(--bad); }
.stepper { display: flex; align-items: flex-start; }
.st { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; }
.st .m { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--glass-3); border: 1px solid var(--line); color: var(--faint); }
.st .m svg { width: 16px; height: 16px; }
.st span { font-size: .74rem; color: var(--muted); font-weight: 600; }
.st em { font-style: normal; font-size: .72rem; color: var(--faint); font-variant-numeric: tabular-nums; min-height: 1em; }
.st.ok .m { background: var(--ok); color: #fff; border-color: transparent; }
.st.bad .m { background: var(--bad); color: #fff; border-color: transparent; }
.st.warn .m { background: var(--warn); color: #fff; border-color: transparent; }
.st.run .m { border: 2px solid var(--a1); border-top-color: transparent; animation: spin .8s linear infinite; }
.stepper .bar { flex: 1; height: 2px; border-radius: 2px; background: var(--line); margin: 13px -6px 0; }
.stepper .bar.ok { background: var(--ok); }
@keyframes spin { to { transform: rotate(360deg); } }
.guide { margin: 8px 0 0; padding-left: 20px; color: var(--text); } .guide li { margin: 5px 0; }
.guide b { font-variant-numeric: tabular-nums; }

/* recent activity */
.recent { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-md); font-size: .85rem; color: var(--muted); }
.recent:hover { background: var(--glass-2); }
.recent .k { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.recent .x { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent time { font-variant-numeric: tabular-nums; flex: none; }
.recent svg { width: 16px; height: 16px; flex: none; opacity: .6; }


/* ======================= device page ======================= */
.page-h { display: flex; align-items: center; gap: 14px; padding: 16px; margin-bottom: 14px; }
.page-h .orb { width: 48px; height: 48px; border-radius: 15px; }
.page-h .orb svg { width: 26px; height: 26px; }
.page-h b { display: block; font-size: 1.1rem; }
.page-h span { display: block; font-size: .84rem; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 99px; margin-bottom: 14px; }
.seg a { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 6px; border-radius: 99px; font-weight: 600; font-size: .92rem; color: var(--muted); transition: background .2s, color .2s; }
.seg a svg { width: 18px; height: 18px; }
.seg a[aria-current=page] { color: var(--text); background: var(--glass-3); box-shadow: inset 0 1px 0 var(--hi), 0 3px 10px var(--shadow); }
.group { padding: 6px 16px; margin-bottom: 14px; }
.group > h3 { display: flex; align-items: center; gap: 10px; margin: 12px 0 4px; font-size: .98rem; }
.gi { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none;
  background: linear-gradient(160deg, rgba(255, 255, 255, .35), transparent 52%), var(--tg, linear-gradient(135deg, var(--a1), var(--a2))); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4); }
.gi svg { width: 18px; height: 18px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-height: 52px; }
.row:first-child, h3 + .row { border-top: none; }
.row .ri { color: var(--muted); flex: none; } .row .ri svg { width: 20px; height: 20px; }
.row .rl { flex: 1; min-width: 0; }
.row .rv { text-align: right; color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; max-width: 60%; }
.row .rv .ok { color: var(--ok); } .row .rv .bad { color: var(--bad); } .row .rv .warn { color: var(--warn); } .row .rv .muted { color: var(--faint); }
button.row { width: 100%; text-align: left; }
:is(button, a).row .rl { font-weight: 600; }
button.row.danger { color: var(--bad); } button.row.danger .ri { color: var(--bad); }
.row > svg.chev { width: 16px; height: 16px; opacity: .45; flex: none; }
.fields { padding: 2px 0 6px; }
.fields .hint { font-size: .8rem; color: var(--muted); margin: 10px 0 0; }
.save-row { display: flex; justify-content: flex-end; padding: 6px 0 12px; }
[data-sec] .save-row { display: none; }
[data-sec].dirty .save-row { display: flex; animation: viewin .2s ease-out; }
.group > h3 .ib { margin-left: auto; width: 30px; height: 30px; background: none; border: none; box-shadow: none; color: var(--muted); }
.group > h3 .ib svg { width: 19px; height: 19px; }
.sel { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.sel span { flex: none; min-width: 64px; font-size: .92rem; }
.sel select { flex: 1; min-width: 0; padding: 10px 12px; }
.save-row .gbtn { padding: 10px 20px; }
.prog { height: 6px; border-radius: 6px; background: var(--glass-3); overflow: hidden; margin: 2px 0 12px; }
.prog i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--a1), var(--a2)); transition: width .3s; }
.prog.ok i { background: var(--ok); } .prog.bad i { background: var(--bad); }
.lvl { float: right; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 12px; margin-top: 6px; }
.color { display: flex; align-items: center; gap: 10px; font-size: .88rem; cursor: pointer; }
.color input { width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 2px solid var(--edge); background: none; overflow: hidden; cursor: pointer; flex: none; }
.color input::-webkit-color-swatch-wrapper { padding: 0; } .color input::-webkit-color-swatch { border: none; border-radius: 50%; }
.color input::-moz-color-swatch { border: none; border-radius: 50%; }

/* timeline */
.tl { list-style: none; margin: 0; padding: 4px 0; }
.tl li { display: grid; grid-template-columns: 10px auto 1fr; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); font-size: .88rem; }
.tl li:first-child { border-top: none; }
.tl .k { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); align-self: center; }
.tl time { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .8rem; }
.tl span { overflow-wrap: anywhere; }
/* event kinds: card's latest line and the timeline */
:is(.tl, .recent) [data-k=ok] .k, .recent[data-k=ok] .k { background: var(--ok); }
:is(.tl, .recent) [data-k=bad] .k, .recent[data-k=bad] .k { background: var(--bad); }
:is(.tl, .recent) [data-k=sleep] .k, .recent[data-k=sleep] .k { background: var(--sleep); }
:is(.tl, .recent) [data-k=warn] .k, .recent[data-k=warn] .k { background: var(--warn); }
:is(.tl, .recent) [data-k=boot] .k, .recent[data-k=boot] .k { background: var(--a1); }
.tl [data-k=bad] span { color: var(--bad); }
.tl [data-k=boot] span { font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 36px 16px; }
.empty .orb { margin: 0 auto 14px; }

/* found devices, wizard, account, login */
.found { padding: 6px 16px; margin-bottom: 16px; }
.step { padding: 14px 0; border-top: 1px solid var(--line); }
.step:first-of-type { border-top: none; }
.step .n { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: .8rem; font-weight: 700; margin-right: 8px; background: linear-gradient(135deg, var(--a1), var(--a2)); }
.copy { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.copy code { flex: 1; padding: 10px 12px; border-radius: var(--r-sm); background: var(--field); border: 1px solid var(--line); font: .84rem ui-monospace, "SF Mono", Consolas, monospace; overflow-wrap: anywhere; }
.copy .k { width: 40px; font-size: .82rem; color: var(--muted); flex: none; }
.qr { background: #fff; padding: 10px; border-radius: var(--r-sm); display: inline-block; margin-top: 10px; }
.hint { font-size: .84rem; color: var(--muted); }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 12px; margin-top: 8px; border-radius: var(--r-md); border: 1px solid var(--line); cursor: pointer; }
.radio:has(input:checked) { border-color: var(--a1); background: color-mix(in srgb, var(--a1) 8%, transparent); }
.radio input { margin-top: 4px; accent-color: var(--a1); }
.radio small { display: block; color: var(--muted); }
.err { color: var(--bad); font-size: .88rem; margin-top: 10px; min-height: 1.2em; }
.login { max-width: 420px; margin: 7vh auto 0; padding: 26px 22px 22px; }
.login .logo { width: 64px; height: 64px; border-radius: 18px; display: block; margin: 0 auto 12px; box-shadow: 0 10px 30px var(--shadow); }
.login h1 { text-align: center; margin: 0; font-size: 1.5rem; }
.login p { text-align: center; color: var(--muted); margin: 4px 0 8px; font-size: .9rem; }
.login .switch { margin-top: 16px; font-size: .9rem; }
.login .gbtn { margin-top: 18px; }
.guide-link { display: block; text-align: center; margin-top: 6px; font-size: .88rem; color: var(--a1); font-weight: 600; }

/* sheet + toast */
.sheet-bg { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; padding: 10px;
  background: rgba(5, 6, 12, .35); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fade .15s; }
.sheet { width: 100%; max-width: 520px; padding: 22px 18px max(18px, env(safe-area-inset-bottom)); animation: up .22s cubic-bezier(.2, .9, .3, 1.2); }
.sheet .orb { width: 48px; height: 48px; border-radius: 15px; margin-bottom: 12px; }
.sheet .orb svg { width: 26px; height: 26px; }
.sheet h3 { margin: 0; font-size: 1.15rem; }
.sheet p { margin: 6px 0 0; color: var(--muted); font-size: .92rem; white-space: pre-line; }
.sheet input { margin-top: 14px; }
.sheet .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.sheet .btns .gbtn { padding: 14px; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (min-width: 640px) { .sheet-bg { align-items: center; } }
.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40; padding: 12px 18px; border-radius: 99px;
  display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .92rem; max-width: calc(100vw - 32px); animation: up .25s ease-out; }
.toast svg { width: 18px; height: 18px; flex: none; }
.toast.ok svg { color: var(--ok); } .toast.bad svg { color: var(--bad); }
@media (max-width: 380px) { .themes { gap: 4px; } .sw { width: 21px; height: 21px; } .act { gap: 9px; padding: 10px; } .tile { width: 38px; height: 38px; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<header class="top glass">
  <button class="ib" id="back" hidden aria-label="返回"></button>
  <a class="brand" href="#/" id="brand"><img src="icon.svg" alt=""><span id="title">WakeKey</span></a>
  <span class="conn" id="conn" role="status"></span>
  <span class="spacer"></span>
  <div class="themes" id="themes" role="radiogroup" aria-label="主題"></div>
  <button class="ib" id="mode"></button>
</header>

<main>
  <section class="view" id="v-login" hidden>
    <form class="login glass" id="loginForm">
      <img class="logo" src="icon.svg" alt="">
      <h1>WakeKey</h1>
      <p>連上你的 MQTT broker</p>
      <label class="f" for="host">Broker</label>
      <input type="text" id="host" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="xxxxxxxx.ala.asia-southeast1.emqxsl.com" required>
      <label class="f" for="user">帳號</label>
      <input type="text" id="user" autocomplete="username" autocapitalize="off" spellcheck="false" value="wk-admin" required>
      <label class="f" for="pass">密碼</label>
      <input type="password" id="pass" autocomplete="current-password" required>
      <label class="switch">記住在這台裝置<input type="checkbox" id="remember" checked><i></i></label>
      <button class="gbtn primary wide" type="submit">連線</button>
      <div class="err" id="loginMsg"></div>
      <a class="guide-link" href="guide.html">第一次使用？EMQX 設定教學</a>
    </form>
  </section>

  <section class="view" id="v-home" hidden>
    <div id="found"></div>
    <div class="grid" id="devices"></div>
    <div class="home-foot">
      <a class="gbtn" href="#/add" id="addLink"></a>
      <a class="gbtn" href="#/account" id="acctLink"></a>
    </div>
  </section>

  <section class="view narrow" id="v-device" hidden></section>
  <section class="view narrow" id="v-add" hidden></section>
  <section class="view narrow" id="v-account" hidden></section>
</main>

<script>

const STORE = "wakekey.login.v1";

const REG_TOPIC = "wakekey/_admin/devices";   /* retained {v:1, devices:[{id,name}]}; devices cannot read it (ACL) */
const MQTTS_PORT = 8883;                       /* what boards use; the page itself uses WSS 8084 */
const CMD_TIMEOUT_MS = 20000;
const ARM_MS = 4000;
const HOLD_MS = 2000;
const ID_RE = /^[a-z0-9][a-z0-9-]{1,15}$/;
const $ = (id) => document.getElementById(id);
let client = null, login = null;
let registry = null;                 /* null until the retained message (or its absence) is known */
const live = new Map();              /* id -> {status, statusAt, events[], ui, journal, ...} */
const pending = new Map();           /* rid -> {resolve, timer} */

/* ---------- storage (per-viewer conveniences only) ---------- */
function loadLogin() { try { return JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { return null; } }
function saveLogin(v) { try { localStorage.setItem(STORE, JSON.stringify(v)); } catch (e) {} }
function clearLogin() { try { localStorage.removeItem(STORE); } catch (e) {} }

/* ---------- helpers ---------- */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function rid() { return Math.random().toString(36).slice(2, 10); }
/* Phones turn a scanned host into "http://host/"; keep only the host name. */
function normHost(h) { return String(h || "").trim().replace(/^[a-z]+:\/\//i, "").replace(/[/?#].*$/, "").replace(/:\d+$/, ""); }
function ago(ts) {
  if (!ts) return "";
  const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
  if (s < 60) return "剛剛";
  if (s < 3600) return Math.round(s / 60) + " 分鐘前";
  return Math.round(s / 3600) + " 小時前";
}
function fmtDur(s) {
  if (s < 60) return "不到 1 分鐘";
  if (s < 3600) return Math.floor(s / 60) + " 分鐘";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h + " 小時" + (m ? " " + m + " 分" : "");
}
function randomPassword(n) {
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  const r = new Uint32Array(n); crypto.getRandomValues(r);
  return Array.from(r, (x) => a[x % a.length]).join("");

function pairingCode(host, user, pw) {
  const bytes = new TextEncoder().encode(JSON.stringify({ h: host, p: MQTTS_PORT, u: user, pw }));
  let bin = ""; bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return "wk1:" + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch (e) {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch (e2) {} t.remove();
  }
  if (btn) { const o = btn.innerHTML; btn.innerHTML = ICON.check; setTimeout(() => { btn.innerHTML = o; }, 1400); }
}
function devName(id) { const d = registry && registry.find((x) => x.id === id); return d ? d.name : id; }
function vibrate() { try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) {} }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  gear: S(`<path d="M10.3 2.8h3.4l.5 2.6a7.4 7.4 0 0 1 1.9 1.1l2.5-.9 1.7 3-2 1.7a7.4 7.4 0 0 1 0 2.2l2 1.7-1.7 3-2.5-.9a7.4 7.4 0 0 1-1.9 1.1l-.5 2.6h-3.4l-.5-2.6a7.4 7.4 0 0 1-1.9-1.1l-2.5.9-1.7-3 2-1.7a7.4 7.4 0 0 1 0-2.2l-2-1.7 1.7-3 2.5.9a7.4 7.4 0 0 1 1.9-1.1z" ${F}/><circle cx="12" cy="12" r="3"/>`),

};
function signal(rssi) {
  const n = rssi >= -55 ? 4 : rssi >= -67 ? 3 : rssi >= -75 ? 2 : 1;
  return S([0, 1, 2, 3].map((i) => `<rect x="${3.5 + i * 4.8}" y="${17 - i * 3.6}" width="3" height="${3.6 + i * 3.6}" rx="1" ${i < n ? 'fill="currentColor" stroke="none"' : 'fill="currentColor" fill-opacity=".18" stroke="none"'}/>`).join(""));
}
/* each board action: icon + color family (tile on the big buttons, glyph tint on the round ones) */
function actionLook(a) {
  if (a.op === "wake") return ["sun", "sun"];
  if (a.op === "rescue") return ["wifi", "amber"];
  return ({ unlock: ["key", "key"], standby: ["moon", "moon"], restart: ["restart", "red"], home: ["home", "teal"] })[(a.args || {}).seq] || ["play", "key"];
}
/* "重新開機（長按）" -> ["重新開機", "長按"]; "執行「home」" -> ["home"] */
function shortLabel(label) {
  const m = String(label).match(/^(.+?)（(.+)）$/);
  const main = (m ? m[1] : String(label)).replace(/^執行「(.+)」$/, "$1");
  return [main, m ? m[2] : ""];

/* ---------- sheet (replaces prompt / confirm) and toast ---------- */
/* Resolves true (or the typed text when o.input is given), or null when cancelled. */
function sheet(o) {
  return new Promise((resolve) => {
    const bg = document.createElement("div");
    bg.className = "sheet-bg";
    const orb = o.icon ? `<div class="orb ${o.danger ? "warn" : ""}" style="${o.danger ? "" : "--og:linear-gradient(135deg,var(--a1),var(--a2))"}">${ICON[o.icon]}</div>` : "";
    bg.innerHTML = `<div class="sheet glass" role="dialog" aria-modal="true">${orb}<h3></h3><p></p>` +
      (o.input !== undefined ? '<input type="text" class="in" autocomplete="off">' : "") +
      `<div class="btns"><button class="gbtn no">${esc(o.cancel || "取消")}</button>` +
      `<button class="gbtn yes ${o.danger ? "danger" : "primary"}">${esc(o.ok || "確定")}</button></div></div>`;
    bg.querySelector("h3").textContent = o.title || "";
    const p = bg.querySelector("p");
    if (o.text) p.textContent = o.text; else p.remove();
    const inp = bg.querySelector(".in");
    if (inp) { inp.value = o.input; inp.placeholder = o.placeholder || ""; }
    const done = (v) => { document.removeEventListener("keydown", key); bg.remove(); resolve(v); };
    const yes = () => {
      if (!inp) return done(true);
      const v = inp.value.trim();
      if (v) done(v); else inp.focus();
    };
    const key = (e) => { if (e.key === "Escape") done(null); else if (e.key === "Enter" && inp) yes(); };
    bg.addEventListener("click", (e) => { if (e.target === bg) done(null); });
    bg.querySelector(".no").onclick = () => done(null);
    bg.querySelector(".yes").onclick = yes;
    document.addEventListener("keydown", key);
    document.body.appendChild(bg);
    if (inp) { inp.focus(); inp.select(); } else bg.querySelector(".yes").focus();
  });
}

/* ---------- MQTT ---------- */
function setConn(text, cls) {
  const c = $("conn");
  c.className = "conn " + (cls || "");
  c.innerHTML = text ? `<b>${esc(text)}</b>` : "";
  c.title = text || "";
}
/* keep: reconnecting the same login (phone back from the background), so the cards
   stay on screen and a failure keeps retrying instead of going back to the login form */
function connect(l, fromSaved, keep) {
  if (client) { client.end(true); client = null; }
  login = Object.assign({}, l, { host: normHost(l.host) });
  if (!keep) registry = null;
  setConn(keep ? "重新連線中" : "連線中", "warn");
  client = mqtt.connect("wss://" + login.host + ":8084/mqtt", {
    username: login.user, password: login.pass,
    clientId: "wk-web-" + rid(), keepalive: 30, reconnectPeriod: 5000, connectTimeout: 15000, clean: true,
  });
  let everConnected = false;
  client.on("connect", () => {
    everConnected = true;
    setConn("已連線", "ok");
    client.subscribe([REG_TOPIC, "wakekey/+/status", "wakekey/+/event", "wakekey/+/resp", "wakekey/+/ui"], { qos: 1 });
    /* a retained registry arrives right after SUBACK; if none does, start with an empty list */
    setTimeout(() => { if (registry === null) { registry = []; renderAll(); } }, 2500);
    showApp();
  });
  client.on("reconnect", () => setConn("重新連線中", "warn"));
  client.on("offline", () => setConn("離線", "bad"));
  client.on("error", (err) => {
    const msg = /auth|password|Not authorized|Bad user/i.test(String(err && err.message)) ? "帳號或密碼錯誤" : "連線失敗：" + (err && err.message);
    if (!everConnected && !keep) { client.end(true); client = null; showLogin(msg, fromSaved ? l : null); }
    setConn(msg, "bad");
  });
  client.on("message", onMessage);
}

function onMessage(topic, payload) {
  const text = new TextDecoder().decode(payload);
  if (topic === REG_TOPIC) {
    try { const j = JSON.parse(text || "{}"); registry = Array.isArray(j.devices) ? j.devices : []; } catch (e) { registry = []; }
    renderAll();
    return;
  }
  const m = topic.match(/^wakekey\/([^/]+)\/(status|event|resp|ui)$/);
  if (!m || m[1].startsWith("_")) return;
  const [, id, kind] = m;
  if (kind === "resp") {
    let r; try { r = JSON.parse(text); } catch (e) { return; }
    if (r.ota) { const w = otaAcks.get(r.rid); if (w) { w.items.push(r); if (w.wake) w.wake(); } return; }
    const p = pending.get(r.rid);
    if (p) { clearTimeout(p.timer); pending.delete(r.rid); p.resolve(r); }
    return;
  }
  const d = liveOf(id);
  if (kind === "ui") {
    let u = null; try { u = text ? JSON.parse(text) : null; } catch (e) {}
    d.ui = u && typeof u === "object" && Array.isArray(u.actions) ? u : null;
    renderAll();
    return;
  }
  if (kind === "status") {
    if (!text) { live.delete(id); renderAll(); return; }   /* retained status cleared (device removed) */
    try { d.status = JSON.parse(text); } catch (e) { return; }
    d.statusAt = Date.now();
    /* back from the setup hotspot (the board still sends one status before it restarts) */
    if (d.status.online === true && d.rescueAt && Date.now() - d.rescueAt > 15000) d.rescueAt = 0;
  } else {
    d.events.push(text);
    if (d.events.length > 40) d.events.shift();
    if (d.journal) d.journal.push(text);
  }
  renderAll();
}
function liveOf(id) {
  if (!live.has(id)) live.set(id, { status: null, statusAt: 0, events: [] });
  return live.get(id);
}

function send(id, op, extra) {
  return new Promise((resolve) => {
    if (!client || !client.connected) { resolve({ ok: false, msg: "還沒連上雲端" }); return; }
    const r = rid();
    const body = Object.assign({ rid: r, ts: Math.floor(Date.now() / 1000), op }, extra || {});
    const timer = setTimeout(() => { pending.delete(r); resolve({ ok: false, msg: "板子沒有回應（可能離線）" }); }, CMD_TIMEOUT_MS);
    pending.set(r, { resolve, timer });
    client.publish("wakekey/" + id + "/cmd", JSON.stringify(body), { qos: 1 });
  });
}

function saveRegistry(list) {
  registry = list;
  client.publish(REG_TOPIC, JSON.stringify({ v: 1, devices: list }), { qos: 1, retain: true });
  renderAll();
}

function stateOf(id, d, st) {
  let cls = "off", ic = "cloudOff", t, s = "", extra = "";
  if (st.online !== true) {
    if (adding && adding.id === id) t = "等待第一次上線";
    else if (d.rescueAt && Date.now() - d.rescueAt < 11 * 60000) {
      cls = "warn"; ic = "wifi"; t = "設定熱點開著";

    else t = "讀取中…";
  } else if (st.usb === "suspended" && st.rwake === 0) {

    s = st.usbdbg ? "USB 除錯埠開著，電腦不允許遠端喚醒" : "電腦不允許遠端喚醒";

/* ---------- journal timeline ---------- */
const TL_KINDS = [
  [/失敗|被拒|錯誤|沒有恢復|不允許|未允許|認證|鎖定/, "bad"],
  [/忽略|熱點/, "warn"],
  [/WakeKey 開機/, "boot"],
  [/suspend|睡眠|待機/, "sleep"],
  [/已喚醒|已送出|恢復|完成|已連線|OK|允許|掛載|resume/, "ok"],
];
function today() { const n = new Date(); return String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0"); }
function parseLine(line) {
  const m = String(line).match(/^(\d\d-\d\d) (\d\d:\d\d:\d\d)\s+(.*)$|^(\+\d+s)\s+(.*)$/);
  const when = !m ? "" : m[1] ? (m[1] === today() ? m[2].slice(0, 5) : m[1] + " " + m[2].slice(0, 5)) : m[4];
  const text = (!m ? String(line) : m[1] ? m[3] : m[5]).replace(/^-+\s*|\s*-+$/g, "");
  const k = (TL_KINDS.find((r) => r[0].test(text)) || [0, ""])[1];
  return { when, text, k };
}
function timelineHtml(lines) {
  return lines.slice().reverse().map((l) => { const e = parseLine(l); return `<li data-k="${e.k}"><span class="k"></span><time>${esc(e.when)}</time><span>${esc(e.text)}</span></li>`; }).join("");
}

function holdButton(btn, fn) {

  const ring = document.createElement("span"); ring.className = "ring";
  (btn.querySelector(".ci") || btn).appendChild(ring);
  const stop = () => { clearTimeout(t); cancelAnimationFrame(raf); t = null; btn.classList.remove("hold"); btn.style.removeProperty("--p"); };
  const tick = () => { btn.style.setProperty("--p", Math.min(100, (Date.now() - t0) / HOLD_MS * 100)); raf = requestAnimationFrame(tick); };
  btn.addEventListener("pointerdown", (ev) => {
    if (btn.disabled) return;
    ev.preventDefault(); btn.classList.add("hold"); t0 = Date.now(); tick();
    t = setTimeout(() => { stop(); vibrate(); fn(); }, HOLD_MS);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach((e) => btn.addEventListener(e, stop));
  btn.addEventListener("contextmenu", (ev) => ev.preventDefault());
}

}

/* Two taps for anything that presses keys on the computer: first tap arms, second runs. */
function armOrRun(btn, fn) {
  const restore = () => { btn.classList.remove("arm"); btn.innerHTML = btn._html; };
  if (btn.classList.contains("arm")) { clearTimeout(btn._t); restore(); fn(); return; }
  btn.classList.add("arm");
  if (btn.classList.contains("act")) btn.querySelector(".lbl").textContent = "再按一次";
  else btn.querySelector(".l").textContent = "再按一次";
  btn._t = setTimeout(restore, ARM_MS);
}
function doAction(id, aid, btn) {
  const a = btn._action;
  if (!a || a.id !== aid) return;
  const c = confirmOf(a);
  if (c === "twotap") armOrRun(btn, () => runAction(id, a));
  else if (c === "dialog") runConfirmed(id, a);

/* hold and dialog: ask first when the board gave a reason (hold), always for dialog */
async function runConfirmed(id, a) {

    const [ic] = actionLook(a);
    if (!(await sheet({ icon: ic, title: (a.ask || shortLabel(a.label)[0]) + "？", text: devName(id) + (a.confirm_text ? "\n" + a.confirm_text : ""), ok: a.ask || shortLabel(a.label)[0], danger }))) return;
  }

}
function stepperHtml(steps) {

/* Wake with live progress: sent → the board woke the computer → the computer reports awake. */
async function runWake(id) {
  const d = liveOf(id), t0 = Date.now();
  const steps = [{ t: "送出", s: "run" }, { t: "喚醒", s: "wait" }, { t: "電腦", s: "wait" }];
  const show = (cls, foot) => { results.set(id, { html: stepperHtml(steps) + (foot || ""), cls: cls || "" }); renderAll(); };
  d.cancelWake = false;
  show();
  let r = await send(id, "wake");
  /* refused because the computer has only just gone to sleep: count down, then send again */
  for (let tries = 0; !r.ok && tries < (r.retry_max || 2); tries++) {
    let wait = r.retry_after;
    if (wait === undefined && /剛進入睡眠/.test(r.msg || "")) wait = 10;   /* boards from before retry_after */
    if (!(wait > 0)) break;
    steps[0].s = "ok"; steps[1].s = "warn";
    for (; wait > 0 && !d.cancelWake; wait--) {
      steps[1].x = wait + " 秒";
      show("warn", `<div class="msg">電腦剛睡著，倒數完自動再送</div><button class="gbtn" data-act="cancel-wake">${ICON.x}取消</button>`);
      await sleep(1000);
    }
    if (d.cancelWake) { steps[1].s = "bad"; steps[1].x = "取消"; show("bad"); return; }
    steps[1].s = "run"; steps[1].x = ""; show();
    r = await send(id, "wake");
  }
  if (!r.ok) {
    if (/沒有回應|還沒連上/.test(r.msg || "")) steps[0].s = "bad";
    else { steps[0].s = "ok"; steps[1].s = "bad"; }
    show("bad", `<div class="msg">${esc(r.msg)}</div>`);
    return;
  }
  steps[0].s = steps[1].s = "ok";
  steps[1].x = ((Date.now() - t0) / 1000).toFixed(1) + "s";
  if (/原本醒著/.test(r.msg)) {
    steps[2] = { t: "本來醒著", s: "ok" };
    show("ok"); vibrate();
    return;
  }
  steps[2].s = "run"; show();
  const sent = Date.now();
  let awake = false;
  for (let ms = 0; ms < 30000 && !awake; ms += 250) {
    const st = liveOf(id).status || {};
    awake = st.usb === "awake" && liveOf(id).statusAt >= t0;
    if (ms % 1000 === 0) { steps[2].x = Math.round(ms / 1000) + "s"; show(); }
    if (!awake) await sleep(250);
  }
  if (awake) {
    steps[2].s = "ok"; steps[2].x = ((Date.now() - sent) / 1000).toFixed(1) + "s";
    show("ok"); vibrate();
  } else {
    steps[2] = { t: "電腦", s: "warn", x: "沒回報" };
    show("warn", '<div class="msg">已送出喚醒，30 秒內電腦沒有回報醒來</div>');
  }
}
async function runAction(id, a) {
  if (a.op === "wake") return runWake(id);
  const [name] = shortLabel(a.label);
  results.set(id, { html: stepperHtml([{ t: name, s: "run" }]) }); renderAll();
  const r = await send(id, a.op, a.args);
  if (r.ok && a.op === "rescue") {
    const d = liveOf(id);
    d.rescueAt = Date.now(); d.rescueAp = r.ap || (d.status || {}).ap;
    results.set(id, { html: rescueGuide(d.rescueAp) });
    if (route().name !== "home") location.hash = "#/";
  } else if (r.ok) {
    results.set(id, { html: `<div class="line ok">${ICON.check}<b>${esc(name)}</b></div><div class="msg">${esc(r.msg)}</div>`, cls: "ok" });
    vibrate();
  } else {
    results.set(id, { html: `<div class="line bad">${ICON.x}<b>${esc(name)}</b></div><div class="msg">${esc(r.msg)}</div>`, cls: "bad" });
  }
  renderAll();
  if (r.ok && a.op !== "rescue") setTimeout(() => { if (results.get(id) && results.get(id).cls === "ok") { results.delete(id); renderAll(); } }, 8000);
}

  if (!Object.keys(changed).length) return;
  if (s.confirm_text && !(await sheet({ icon: (SECTION_LOOK[s.id] || ["gear"])[0], title: s.label, text: s.confirm_text, ok: "儲存" }))) return;
  btn.disabled = true;
  const [op, extra] = s.save ? s.save(Object.assign({}, cfg, all)) : ["set", { section: sid, values: changed }];
  const r = await send(id, op, extra);
  toast(r.msg || (r.ok ? "已儲存" : "沒有儲存"), r.ok);
  if (r.ok) { sec.classList.remove("dirty"); setTimeout(() => { if (devPage && devPage.id === id && devPage.tab === "set") renderDevice(id, "set", true); }, 1500); }
  else btn.disabled = false;
}
async function loadJournal(id) {
  const r = await send(id, "journal");
  if (r.ok) { liveOf(id).journal = (r.lines || []).concat(); renderAll(); }
  else toast(r.msg, false);
}

/* ---------- buttons the page itself owns ---------- */
async function act(id, what, btn) {
  const d = liveOf(id);
  if (what === "journal") { btn.disabled = true; await loadJournal(id); btn.disabled = false; return; }
  if (what === "hint") {
    const h = btn.closest("[data-sec]").querySelector(".hint"), open = h.hidden;
    h.hidden = !open; btn.setAttribute("aria-expanded", String(open));
    return;
  }
  if (what === "cancel-wake") { d.cancelWake = true; return; }
  if (what === "ota") { pickFirmware(id); return; }
  if (what === "ota-cancel") { const r = otaRuns.get(id); if (r) r.cancel = true; return; }
  if (what === "ota-close") { otaRuns.delete(id); renderAll(); return; }
  if (what === "usbdbg-off") {
    if (!(await sheet({ icon: "usb", title: "關閉 USB 除錯埠？", ok: "關閉並重開",
      text: devName(id) + " 會重新開機（約 20 秒離線），之後只當純鍵盤，下次睡眠就叫得醒。" }))) return;
    const r = d.ui ? await send(id, "set", { section: "usbdbg", values: { usbdbg: false } }) : await send(id, "set_usb_debug", { on: false });
    toast(r.msg, r.ok);
    return;
  }
  if (what === "rename") {
    const name = await sheet({ icon: "pencil", title: "改名稱", input: devName(id), ok: "儲存" });
    if (!name) return;
    saveRegistry(registry.map((x) => (x.id === id ? { id, name } : x)));
    toast("已改名");
    return;
  }
  if (what === "remove") {
    if (!(await sheet({ icon: "trash", title: "移除「" + devName(id) + "」？", ok: "移除", danger: true,
      text: "只從清單移除；板子和它的雲端帳號不受影響。要徹底移除，請到 EMQX 刪掉帳號「" + id + "」。" }))) return;
    results.delete(id);
    saveRegistry(registry.filter((x) => x.id !== id));
    /* clear its retained messages so it does not show up again under 發現新裝置 until it reconnects */
    client.publish("wakekey/" + id + "/status", "", { qos: 1, retain: true });
    client.publish("wakekey/" + id + "/ui", "", { qos: 1, retain: true });
    live.delete(id);
    location.hash = "#/";
  }
}

/* ---------- firmware update over the cloud (boards whose status has "ota") ---------- */
/* The board takes the file in chunks on wakekey/<id>/ota (u32 session, u32 offset, data),
   up to "window" of them unacked; each is acked on resp with the rid of ota_begin and
   the offset the board needs next. The same offset twice means a chunk was dropped:
   send again from there. See cloud.c. */
const otaRuns = new Map();   /* id -> {pct, text, cls, to, cancel} */
const otaAcks = new Map();   /* rid -> {items: acks not read yet, wake: waiting reader} */
function otaHtml(id) {
  const r = otaRuns.get(id);
  if (!r) return "";
  const btn = r.cls === "run" ? `<button class="gbtn" data-act="ota-cancel">取消</button>` : `<button class="gbtn" data-act="ota-close">關閉</button>`;
  return `<div class="group glass"><div class="row"><span class="ri">${ICON.upload}</span><span class="rl">韌體更新${r.to ? " → " + esc(r.to) : ""}</span></div>
    <div class="prog ${r.cls}"><i style="width:${Math.round(r.pct * 100)}%"></i></div>
    <p class="hint" style="margin:0 0 8px">${esc(r.text)}</p><div class="save-row">${btn}</div></div>`;
}
function pickFirmware(id) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".bin";
  inp.onchange = () => { if (inp.files[0]) startOta(id, inp.files[0]); };
  inp.click();
}
/* esp_image_header_t (chip id at 12), then a segment header, then esp_app_desc_t at 32 */
function imageInfo(buf) {
  if (buf.byteLength < 288) return { err: "檔案太小，不是韌體" };
  const dv = new DataView(buf), str = (o) => new TextDecoder().decode(new Uint8Array(buf, o, 32)).replace(/\0[\s\S]*$/, "");
  if (dv.getUint8(0) !== 0xe9) return { err: "不是 ESP 韌體檔" };
  if (dv.getUint32(32, true) !== 0xabcd5432) return { err: "這是 merged.bin，請改選 wakekey-ota.bin" };
  if (dv.getUint16(12, true) !== 9) return { err: "韌體不是給 ESP32-S3 的" };
  if (str(80) !== "wakekey") return { err: "不是 WakeKey 韌體" };
  return { version: str(48) };
}
/* next ack for rid, or null after ms */
function otaNext(rid, ms) {
  const w = otaAcks.get(rid);
  if (w.items.length) return Promise.resolve(w.items.shift());
  return new Promise((resolve) => {
    const t = setTimeout(() => { w.wake = null; resolve(null); }, ms);
    w.wake = () => { clearTimeout(t); w.wake = null; resolve(w.items.shift()); };
  });
}
async function startOta(id, file) {
  const buf = await file.arrayBuffer(), info = imageInfo(buf), st = liveOf(id).status || {};
  if (info.err) { toast(info.err, false); return; }
  if (!(await sheet({ icon: "upload", title: "更新「" + devName(id) + "」的韌體？", ok: "開始更新",
    text: `${st.ver || "?"} → ${info.version}（${Math.round(buf.byteLength / 1024)} KB）。傳完板子會重新開機，大約離線 20 秒；新版開機失敗會自動退回舊版。傳送時請留在這一頁。` }))) return;
  const run = { pct: 0, text: "準備中…", cls: "run", to: info.version, cancel: false };
  otaRuns.set(id, run);
  const show = (text, cls, pct) => { run.text = text; if (cls) run.cls = cls; if (pct !== undefined) run.pct = pct; renderAll(); };
  let lock = null;
  try { lock = await navigator.wakeLock.request("screen"); } catch (e) {}
  try {
    const sha = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", buf)), (b) => b.toString(16).padStart(2, "0")).join("");
    const r = await send(id, "ota_begin", { size: buf.byteLength, sha256: sha });
    if (!r.ok) { show(r.msg || "板子沒有開始更新", "bad"); return; }
    const sess = r.sess >>> 0, chunk = r.chunk || 8192, win = r.window || 1, size = buf.byteLength, t0 = Date.now();
    otaAcks.set(r.rid, { items: [], wake: null });
    const sendAt = (off) => {
      const n = Math.min(chunk, size - off), msg = new Uint8Array(8 + n), dv = new DataView(msg.buffer);
      dv.setUint32(0, sess, true); dv.setUint32(4, off, true);
      msg.set(new Uint8Array(buf, off, n), 8);
      if (client && client.connected) client.publish("wakekey/" + id + "/ota", msg, { qos: 1 });
      return off + n;
    };
    let acked = 0, next = 0, misses = 0, rewound = -1;
    const fill = () => { while (next < size && next < acked + win * chunk) next = sendAt(next); };
    try {
      fill();
      for (;;) {
        if (run.cancel) { send(id, "ota_abort"); show("已取消，板子繼續用原本的韌體", "bad"); return; }
        const a = await otaNext(r.rid, 10000);
        if (!a) {
          if (++misses >= 4) {
            if (acked + win * chunk >= size && next >= size) break;   /* the last acks got lost: the board may be restarting */
            send(id, "ota_abort"); show("板子沒有回應，更新中止；板子繼續用原本的韌體", "bad"); return;
          }
          next = acked; fill();         /* resend everything not acked */
          continue;
        }
        misses = 0;
        if (a.ota === "fail") { show("更新失敗：" + (a.msg || "") + "；板子繼續用原本的韌體", "bad"); return; }
        if (a.ota === "done") break;
        if (a.off > acked) acked = a.off;
        else if (a.off === acked && next > acked && rewound !== acked) { rewound = acked; next = acked; }   /* a chunk was dropped */
        fill();
        const s = (Date.now() - t0) / 1000, left = acked ? Math.round(s * (size - acked) / acked) : 0;
        show(`傳送中 ${Math.round(acked / 1024)} / ${Math.round(size / 1024)} KB` + (acked > chunk * 3 ? `，約剩 ${left} 秒` : ""), null, acked / size * 0.97);
      }
    } finally {
      otaAcks.delete(r.rid);
    }
    show("已寫入並驗證，板子重新開機中…", null, 0.98);
    /* done when the board is back with the new version (it may also have rolled back);
       only a status from after the restart counts, so re-sending the same version works */
    const tDone = Date.now();
    for (let i = 0; i < 60; i++) {
      await sleep(2000);
      const d2 = liveOf(id), s2 = d2.status || {};
      if (d2.statusAt > tDone && s2.online && s2.ver === info.version && s2.up <= (Date.now() - tDone) / 1000 + 5) { show("已更新到 " + info.version + "，新版運作 30 秒後確認", "ok", 1); vibrate(); return; }
    }
    show("2 分鐘內沒看到新版上線，請看「紀錄」；新版開機失敗時會自動退回舊版", "bad");
  } finally {
    if (lock) lock.release().catch(() => {});
  }
}

/* ---------- add device ---------- */
function renderAdd() {
  const c = $("v-add");
  if (!adding) adding = { stage: 1 };
  if (adding.stage === 1) {
    c.innerHTML = `<form class="group glass" id="aForm" style="padding:6px 18px 18px">
      <h3><span class="gi">${ICON.sparkle}</span>新增裝置</h3>
      <label class="f" for="aName">名稱</label><input type="text" id="aName" placeholder="家裡筆電">
      <label class="f" for="aId">代號（英文小寫、數字、-；之後不能改）</label><input type="text" id="aId" autocapitalize="off" spellcheck="false" placeholder="home">
      <label class="radio"><input type="radio" name="aKind" value="new" checked><span><b>新的板子</b><small>產生雲端帳號和配對碼</small></span></label>
      <label class="radio"><input type="radio" name="aKind" value="old"><span><b>已經配對過</b><small>只加到清單</small></span></label>
      <div class="err" id="aMsg"></div>
      <button class="gbtn primary wide" type="submit">下一步</button></form>`;
    $("aForm").onsubmit = (ev) => {
      ev.preventDefault();
      const name = $("aName").value.trim(), id = $("aId").value.trim().toLowerCase();
      const kind = c.querySelector("input[name=aKind]:checked").value;
      const bad = (t) => { $("aMsg").textContent = t; };
      if (!name) return bad("請填名稱");
      if (!ID_RE.test(id)) return bad("代號只能用英文小寫、數字和 -，2–16 字，開頭不能是 -");
      if (id === "wk-admin") return bad("這個代號保留給控制網頁");
      if (registry.some((x) => x.id === id)) return bad("清單裡已經有這個代號");
      saveRegistry(registry.concat([{ id, name }]));
      if (kind === "old") { adding = null; location.hash = "#/"; return; }
      const pw = randomPassword(24);
      adding = { stage: 2, id, name, pw, code: pairingCode(login.host, id, pw) };
      renderAdd();
    };
    return;
  }
  const a = adding, online = (live.get(a.id) || {}).status?.online === true;
  const cp = (v) => `<button class="ib" data-copy="${esc(v)}" aria-label="複製">${ICON.copy}</button>`;
  c.innerHTML = `<div class="group glass" style="padding:6px 18px 18px">
    <h3><span class="gi">${ICON.sparkle}</span>新增「${esc(a.name)}」</h3>
    <p class="hint">密碼只顯示這一次，照順序做完再關掉。</p>
    <div class="step"><span class="n">1</span><b>在 EMQX 建立帳號</b>
      <p class="hint"><a href="https://cloud-intl.emqx.com/console/" target="_blank" rel="noopener" style="color:var(--a1)">EMQX 控制台</a> → 部署 → 存取控制 → 認證 → 使用者 → 新增（<a href="guide.html#device" target="_blank" rel="noopener" style="color:var(--a1)">圖文步驟</a>；也可以<a href="guide.html#ai" target="_blank" rel="noopener" style="color:var(--a1)">交給 AI 自動建立</a>）</p>
      <div class="copy"><span class="k">帳號</span><code>${esc(a.id)}</code>${cp(a.id)}</div>
      <div class="copy"><span class="k">密碼</span><code>${esc(a.pw)}</code>${cp(a.pw)}</div></div>
    <div class="step"><span class="n">2</span><b>把配對碼存進板子</b>
      <p class="hint">板子網頁 → 設定 → 雲端（MQTT）→ 貼上</p>
      <div class="copy"><code>${esc(a.code)}</code>${cp(a.code)}</div>
      <div class="qr" id="aQr"></div></div>
    <div class="step"><span class="n">3</span><b>等板子上線</b>
      <div class="line ${online ? "ok" : ""}" style="margin-top:8px">${online ? ICON.check + "已上線" : '<span class="st run" style="min-width:0"><span class="m" style="width:18px;height:18px"></span></span>等待中…'}</div></div>
    <button class="gbtn primary wide" id="aDone">完成</button></div>`;
  c.querySelectorAll("button[data-copy]").forEach((b) => { b.onclick = () => copy(b.dataset.copy, b); });
  try { new QRCode($("aQr"), { text: a.code, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.L }); } catch (e) { $("aQr").remove(); }
  $("aDone").onclick = async () => {
    if (!online && !(await sheet({ icon: "alert", title: "板子還沒上線，確定關掉？", ok: "關掉", danger: true,
      text: "關掉後就看不到這組密碼和配對碼，要重來得先到 EMQX 刪掉帳號。" }))) return;
    adding = null; location.hash = "#/";
  };
}
/* refresh the wizard's "等板子上線" line when that device comes online */
setInterval(() => {
  if (adding && adding.stage === 2 && (live.get(adding.id) || {}).status?.online === true && !adding.seenOnline) {
    adding.seenOnline = true; renderAdd();
  }
}, 1000);

/* ---------- account ---------- */
function renderAccount() {
  const c = $("v-account"), n = registry ? registry.length : 0;
  const h = `<div class="group glass">
    <div class="row"><span class="ri">${ICON.user}</span><span class="rl">${esc(login ? login.user : "")}</span><span class="rv">${n} 台裝置</span></div>
    <div class="row"><span class="ri">${ICON.cloud}</span><span class="rl">Broker</span><span class="rv">${esc(login ? login.host : "")}</span></div></div>
    <div class="group glass">
    <a class="row" href="guide.html" target="_blank" rel="noopener"><span class="ri">${ICON.info}</span><span class="rl">EMQX 設定教學</span>${ICON.chevR.replace("<svg", '<svg class="chev"')}</a></div>
    <div class="group glass">
    <button class="row" id="logout"><span class="ri">${ICON.logout}</span><span class="rl">登出</span></button>
    <button class="row danger" id="forget"><span class="ri">${ICON.trash}</span><span class="rl">登出並忘記密碼</span></button></div>`;
  if (c._html === h) return;
  c.innerHTML = h; c._html = h;
  $("logout").onclick = () => { disconnect(); showLogin(); };
  $("forget").onclick = () => { clearLogin(); disconnect(); showLogin(); $("pass").value = ""; };
}

/* ---------- login / logout ---------- */
$("loginForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const l = { host: normHost($("host").value), user: $("user").value.trim(), pass: $("pass").value };
  $("host").value = l.host;
  if ($("remember").checked) saveLogin(l); else clearLogin();
  $("pass").value = "";
  $("loginMsg").textContent = "";
  connect(l, false);
});
function disconnect() {
  if (client) client.end(true);
  client = null; registry = null; adding = null; devPage = null;
  live.clear(); cards.clear(); results.clear();
  $("devices").innerHTML = "";
  $("v-account")._html = "";
  location.hash = "#/";
}
/* durations (睡眠中 · 12 分鐘, 幾分鐘前) */
setInterval(renderAll, 30000);

/* Back from the background (phone app switch, screen on): the socket is often dead
   while the client still thinks it is connected, so reconnect at once instead of
   waiting up to a keepalive; the retained statuses then refresh every card. */
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (!login || !client) return;
  if (!client.connected || Date.now() - hiddenAt > 15000) connect(login, true, true);
  renderAll();
});

/* Opens instantly and offline from the copy sw.js keeps (GitHub Pages is https). */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

const saved = loadLogin();
if (saved && saved.pass) connect(saved, true); else showLogin();
</script>
